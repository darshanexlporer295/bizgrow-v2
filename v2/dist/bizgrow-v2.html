/* BizGrow v2: sign-up questions, sign-up consent, privacy notice and the consent switch on the Privacy page.
   Six questions, one per screen, after an owner signs up (or logs in before finishing), before Home.
   Only the optional questions can be skipped. Demo only: answers are kept in this browser through the mock API,
   in the shape the future server will use. Loaded after app.js and v2-privacy.js. */
(function () {
  'use strict';
  var B = window.BGV2; if (!B) return;
  function esc(s) { return B.esc(s); }
  function $(s) { return document.querySelector(s); }

  // Consent wording version. Bump it (and mock-api.js CONSENT_VERSION) whenever the consent or notice text changes.
  var CONSENT_VERSION = 'signup-consent-v1';
  var LANG_NAMES = { en: 'English', hi: 'हिन्दी', mr: 'मराठी', gu: 'ગુજરાતી' };

  // Config lists. To add a trade later (for example manufacturer or wholesale), add its key here and a
  // su_trade_<key> line in v2-i18n-signup.js. The server list must match.
  var CONFIG = {
    trades: ['textile', 'plastic', 'chemical', 'agri', 'other'],
    teams: ['just_me', '2_5', '6_20', '20_plus'],
    problems: ['udhar', 'stock', 'accounts', 'staff', 'other'],
    owe: ['0_10', '10_50', '50_plus']
  };

  // The six questions, in order. Only the optional ones (required: false) can be skipped.
  var STEPS = [
    { key: 'shop_name', type: 'text', required: true, max: 60 },
    { key: 'trade', type: 'choice', required: true, list: CONFIG.trades, prefix: 'su_trade_' },
    { key: 'city', type: 'text', required: false, max: 40 },
    { key: 'team_size', type: 'choice', required: false, list: CONFIG.teams, prefix: 'su_team_' },
    { key: 'problem', type: 'choice', required: false, list: CONFIG.problems, prefix: 'su_problem_' },
    { key: 'udhar_customers', type: 'choice', required: false, list: CONFIG.owe, prefix: 'su_owe_' }
  ];

  var W = null; // state of the questions while they are on screen

  function hasAnswer(o, k) { return !!o && o[k] !== undefined && o[k] !== null && o[k] !== ''; }

  // Called by app.js before the normal screens. Returns true when the questions took over the screen.
  B.gate = function () {
    var me = B.S.me;
    if (!me || me.signup_done !== false) { W = null; return false; }
    if (!W) {
      W = { i: 0, a: Object.assign({}, me.signup_answers || {}), busy: false };
      var first = -1;
      for (var j = 0; j < STEPS.length; j++) { if (!hasAnswer(W.a, STEPS[j].key)) { first = j; break; } }
      W.i = first < 0 ? STEPS.length - 1 : first;
    }
    draw();
    return true;
  };

  function draw() {
    var s = STEPS[W.i], n = W.i + 1, total = STEPS.length, cur = W.a[s.key];
    document.documentElement.lang = B.S.lang;
    var langs = Object.keys(LANG_NAMES).map(function (k) {
      return '<option value="' + k + '"' + (B.S.lang === k ? ' selected' : '') + '>' + LANG_NAMES[k] + '</option>';
    }).join('');
    var dots = STEPS.map(function (x, j) {
      return '<span class="su-dot' + (j < W.i ? ' done' : '') + (j === W.i ? ' on' : '') + '"></span>';
    }).join('');
    var back = W.i > 0 ? '<button type="button" class="btn sec" data-act="su-back">' + esc(B.tx('su_back')) + '</button>' : '<span></span>';
    var skip = s.required ? '' : '<button type="button" class="btn sec" data-act="su-skip">' + esc(B.tx('su_skip')) + '</button>';
    var body;
    if (s.type === 'text') {
      var ph = s.key === 'shop_name' ? 'su_name_ph' : 'su_city_ph';
      var last = W.i === STEPS.length - 1;
      body = '<form data-form="su" class="su-form">' +
        '<input class="in su-in" name="' + s.key + '" value="' + esc(cur || '') + '" placeholder="' + esc(B.tx(ph)) + '"' +
        ' autocomplete="off" maxlength="' + s.max + '"' + (s.required ? ' required' : '') + ' aria-label="' + esc(B.tx('su_q' + n)) + '">' +
        '<div class="su-nav">' + back + skip + '<button type="submit" class="btn">' + esc(B.tx(last ? 'su_finish' : 'su_next')) + '</button></div></form>';
    } else {
      body = '<div class="su-opts">' + s.list.map(function (v) {
        return '<button type="button" class="su-opt" aria-pressed="' + (cur === v) + '" data-act="su-pick" data-v="' + v + '">' + esc(B.tx(s.prefix + v)) + '</button>';
      }).join('') + '</div><div class="su-nav">' + back + skip + '<span></span></div>';
    }
    var html =
      '<div class="su-wrap"><div class="su-box">' +
        '<div class="su-top"><div class="su-brand">BizGrow</div>' +
        '<select class="in su-lang" id="suLang" aria-label="' + esc(B.tx('su_lang_name')) + '">' + langs + '</select></div>' +
        '<div class="su-dots" aria-hidden="true">' + dots + '</div>' +
        '<div class="su-count">' + esc(B.tx('su_progress', { n: n, total: total })) + '</div>' +
        '<h2 class="su-title">' + esc(B.tx('su_q' + n)) + '</h2>' +
        '<p class="su-hint">' + esc(B.tx('su_q' + n + '_hint')) + '</p>' +
        body +
        '<div class="su-out"><button type="button" class="linkbtn" data-act="logout">' + esc(B.tx('su_signout')) + '</button></div>' +
      '</div></div>';
    $('#app').innerHTML = html;
    var sel = document.getElementById('suLang');
    if (sel) sel.onchange = function () {
      B.S.lang = sel.value; localStorage.setItem('bg_lang', sel.value);
      B.api('/language', 'PUT', { lang: sel.value }).catch(function () { /* demo: keep going */ });
      draw();
    };
  }

  // Save one answer (or a skip) and move on. The last question also marks the sign-up finished.
  async function answer(value) {
    if (!W || W.busy) return;
    var s = STEPS[W.i], partial = {};
    if (value !== undefined && value !== '') { partial[s.key] = value; W.a[s.key] = value; }
    var last = W.i === STEPS.length - 1;
    W.busy = true;
    try {
      if (last) await B.api('/signup/answers', 'PUT', { answers: partial, done: true });
      else if (Object.keys(partial).length) await B.api('/signup/answers', 'PUT', { answers: partial, done: false });
    } catch (err) {
      W.busy = false; B.toast(err.message || B.tx('su_need_name')); return;
    }
    W.busy = false;
    if (last) return finish();
    W.i++; draw();
  }

  async function finish() {
    try { B.S.me = await B.api('/me'); }
    catch (e) { B.S.me = Object.assign({}, B.S.me, { signup_done: true }); }
    W = null;
    B.toast(B.tx('su_done'));
    B.go('#/home');
  }

  B.ACT['su-pick'] = function (el) { answer(el.dataset.v); };
  B.ACT['su-skip'] = function () { if (W && !STEPS[W.i].required) answer(undefined); };
  B.ACT['su-back'] = function () { if (W && W.i > 0 && !W.busy) { W.i--; draw(); } };

  // Text questions post their form here. The required ones must have something typed.
  B.FORM.su = async function (f, d) {
    var s = STEPS[W.i];
    var v = String(d[s.key] || '').trim();
    if (s.required && !v) throw new Error(B.tx(s.key === 'shop_name' ? 'su_need_name' : 'su_need_trade'));
    await answer(v);
  };

  // Sign-up form: the box must be ticked. The shop name and trade are now asked in the questions.
  B.FORM.signup = async function (f, d) {
    if (!d.consent) throw new Error(B.tx('su_consent_need'));
    var lang = B.S.lang;
    await B.api('/signup', 'POST', d);
    await B.api('/language', 'PUT', { lang: lang }).catch(function () { /* demo: keep going */ });
    B.S.me = await B.api('/me');
    B.S.lang = (B.S.me.shop && B.S.me.shop.lang) || lang;
    B.go('#/home');
  };

  // ---- privacy notice (sign-up link and the Privacy page) ----
  var NOTICE = [['pn_collect_h', 'pn_collect'], ['pn_who_h', 'pn_who'], ['pn_why_h', 'pn_why'], ['pn_out_h', 'pn_out'], ['pn_contact_h', 'pn_contact'], ['pn_record_h', 'pn_record']];
  function noticeBody() {
    return NOTICE.map(function (p) {
      return '<h4>' + esc(B.tx(p[0])) + '</h4><p>' + esc(B.tx(p[1], { v: CONSENT_VERSION })) + '</p>';
    }).join('');
  }
  B.ACT['privacy-notice'] = function () {
    B.modal('<h2>' + esc(B.tx('pn_title')) + '</h2><p class="small muted mb">' + esc(B.tx('pn_intro')) + '</p>' +
      '<div class="su-notice">' + noticeBody() + '</div>' +
      '<button class="btn block mt" onclick="this.closest(\'.ov\').close()">OK</button>');
  };

  function when(iso) {
    var loc = { en: 'en-IN', hi: 'hi-IN', mr: 'mr-IN', gu: 'gu-IN' }[B.S.lang] || 'en-IN';
    try { return new Date(iso).toLocaleString(loc, { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }); }
    catch (e) { return String(iso || ''); }
  }

  // Privacy page: the consent switch (top) and the full notice (bottom).
  B.on('privacy', function (v) {
    var rec = (B.S.me && B.S.me.consent) || null;
    var on = !!(rec && rec.granted);
    var consentCard =
      '<div class="card" style="margin-bottom:14px"><h3>' + esc(B.tx('pv_consent_title')) + '</h3>' +
      '<p class="muted small mb">' + esc(B.tx('pv_consent_sub')) + '</p>' +
      '<label class="sw"><input type="checkbox" role="switch" data-v2="consent"' + (on ? ' checked' : '') + '>' +
      '<span class="sw-track" aria-hidden="true"></span><span class="bold">' + esc(B.tx(on ? 'pv_on' : 'pv_off')) + '</span></label>' +
      '<p class="muted small mt">' + (rec ? esc(B.tx('pv_record', { when: when(rec.at), v: rec.text_version || CONSENT_VERSION })) : esc(B.tx('pv_record_none'))) + '</p></div>';
    B.placeTop(v, consentCard);
    var grid = v.querySelector('.grid');
    var notice = '<div class="card su-wide"><h3>' + esc(B.tx('pv_notice_title')) + '</h3>' +
      '<p class="muted small mb">' + esc(B.tx('pv_notice_sub')) + '</p>' +
      '<div class="su-notice">' + noticeBody() + '</div></div>';
    if (grid) grid.insertAdjacentHTML('beforeend', notice);
  });

  // The switch records every change as a dated entry.
  document.addEventListener('change', async function (e) {
    var el = e.target;
    if (!el || !el.matches || !el.matches('[data-v2="consent"]')) return;
    var granted = el.checked;
    el.disabled = true;
    try {
      var r = await B.api('/consent', 'POST', { granted: granted });
      B.S.me.consent = r.consent;
      B.toast(B.tx(granted ? 'pv_on' : 'pv_off'));
      B.render();
    } catch (err) {
      el.checked = !granted;
      B.toast(err.message || B.tx('pv_off'));
    } finally { el.disabled = false; }
  });
})();

</script><script>
/* BizGrow v2: online store. Three parts:
   1. Owner: the Store page (turn on/off, link, share, preview).
   2. Team: the Orders page (new-orders badge, status, reply on WhatsApp).
   3. Public: the store a buyer opens from the link (?shop=...). No sign-in.
   Loaded after app.js. Uses window.BGV2 that app.js exposes. */
(function () {
  'use strict';
  var B = window.BGV2; if (!B) return;

  var ORDER_STATUSES = ['new', 'accepted', 'packed', 'delivered', 'cancelled'];
  var esc = B.esc;

  // Small styles for the public page and the order cards. Mobile first, 44px tap targets.
  var CSS = '' +
    '.ps{max-width:640px;margin:0 auto;padding:14px 14px 48px;color:#0F172A}' +
    '.ps h1{font-size:22px;margin:0 0 4px;overflow-wrap:anywhere}' +
    '.ps-meta{font-size:14px;color:#64748B}.ps-meta a{color:#0A192F}' +
    '.ps-intro{color:#475569;font-size:15px;margin:10px 0 0}' +
    '.ps-search{width:100%;min-height:44px;padding:10px 12px;border:1px solid #CBD5E1;border-radius:10px;font-size:16px;box-sizing:border-box;margin:12px 0;font-family:inherit}' +
    '.ps-list{display:flex;flex-direction:column;gap:8px}' +
    '.ps-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:10px 12px}' +
    '.ps-info{flex:1;min-width:0}.ps-info b{display:block;font-size:16px;overflow-wrap:anywhere}.ps-info small{color:#64748B;font-size:13px}' +
    '.ps-btn{min-height:44px;min-width:44px;border-radius:10px;border:1px solid #CBD5E1;background:#fff;color:#0A192F;font-size:16px;font-weight:600;cursor:pointer;padding:0 12px;font-family:inherit}' +
    '.ps-add{background:#0A192F;color:#fff;border-color:#0A192F}' +
    '.ps-step{display:flex;align-items:center;gap:6px}.ps-step span{min-width:28px;text-align:center;font-weight:700}' +
    '.ps-card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:14px;margin-top:14px}' +
    '.ps-card h2{font-size:17px;margin:0 0 8px}' +
    '.ps-line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F1F5F9;font-size:15px}' +
    '.ps-line .ps-grow{flex:1;min-width:0;overflow-wrap:anywhere}' +
    '.ps-total{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding-top:10px}' +
    '.ps-field{display:block;margin-bottom:10px;font-size:14px;color:#334155}' +
    '.ps-field input,.ps-field textarea{display:block;width:100%;min-height:44px;margin-top:4px;padding:10px 12px;border:1px solid #CBD5E1;border-radius:10px;font-size:16px;box-sizing:border-box;font-family:inherit}' +
    '.ps-send{width:100%;min-height:48px;border:0;border-radius:12px;background:#0A192F;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}' +
    '.ps-send:disabled{opacity:.6;cursor:default}' +
    '.ps-msg{color:#B91C1C;font-size:14px;margin:10px 0 0}' +
    '.ps-done{background:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;padding:14px;margin-top:14px;font-size:15px}' +
    '.ps-wa{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:8px;padding:0 16px;border-radius:10px;background:#25D366;color:#fff;font-weight:700;text-decoration:none}' +
    '.ord-lines{padding-left:18px;line-height:1.7;margin:8px 0}' +
    '.ord-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}' +
    '.ord-chips .btn{min-height:44px}' +
    '.ord select.in{min-height:44px}';
  (function addCss() {
    var s = document.createElement('style'); s.id = 'v2-store-css'; s.textContent = CSS;
    document.head.appendChild(s);
  })();

  function inrf(n) { return '₹' + (Math.round((+n || 0) * 100) / 100).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
  function digits(s) { return String(s || '').replace(/\D/g, ''); }
  function waUrl(phone, text) {
    var p = digits(phone); if (p.length === 10) p = '91' + p;
    return 'https://wa.me/' + (p ? p : '') + '?text=' + encodeURIComponent(text);
  }
  function storeLink(slug) { return location.origin + location.pathname + '?shop=' + encodeURIComponent(slug); }
  function when(at) {
    var d = new Date(at); if (isNaN(d)) return '';
    return d.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
  }
  function fetchPublicStore(slug) {
    return fetch('/api/public/store?shop=' + encodeURIComponent(slug)).then(function (r) {
      if (!r.ok) throw new Error('bad');
      return r.json();
    });
  }

  /* ---------- 1. Owner: the Store page ---------- */
  B.on('store', function (v) { renderStore(v); });

  function renderStore(v) {
    var sh = B.S.me.shop, on = !!(sh.store_enabled && sh.store_slug);
    var link = on ? storeLink(sh.store_slug) : '';
    var body = '';
    if (on) {
      body += '<div class="okmsg">' + esc(B.tx('st_live')) + '</div>' +
        '<div class="f"><label>' + esc(B.tx('st_link')) + '</label><input class="in" readonly value="' + esc(link) + '" onclick="this.select()"></div>' +
        '<div class="row wrap">' +
        '<a class="btn" target="_blank" rel="noopener" href="' + esc(waUrl('', B.tx('wa_store', { shop: sh.name, link: link }))) + '">' + esc(B.tx('st_share')) + '</a>' +
        '<button class="btn sec" data-act="storepreview">' + esc(B.tx('st_preview')) + '</button>' +
        (B.isOwner() ? '<button class="btn red" data-act="storeoff">' + esc(B.tx('st_turn_off')) + '</button>' : '') +
        '</div>';
    } else {
      body += '<p class="mb">' + esc(B.tx('st_off')) + '</p>';
      if (B.isOwner()) {
        body += sh.phone
          ? '<button class="btn" data-act="storeon">' + esc(B.tx('st_turn_on')) + '</button>'
          : '<div class="err">' + esc(B.tx('st_need_phone')) + '</div><a class="btn" href="#/settings">' + esc(B.tx('st_open_settings')) + '</a>';
      } else {
        body += '<p class="muted">' + esc(B.tx('st_ask_owner')) + '</p>';
      }
    }
    body += '<p class="muted small mt">' + esc(B.tx('st_privacy')) + '</p>';
    v.innerHTML = B.head(B.tx('st_title'), B.tx('st_sub'), '') + '<section class="card" style="max-width:640px">' + body + '</section>';
  }

  async function setStore(on) {
    await B.api('/store', 'PUT', { enabled: on });
    B.S.me = await B.api('/me');
    B.toast(B.tx(on ? 'st_on_done' : 'st_off_done'));
    B.render();
  }
  B.ACT.storeon = function () { return setStore(true); };
  B.ACT.storeoff = function () { return setStore(false); };
  B.ACT.storepreview = async function () {
    var sh = B.S.me.shop;
    var r = null;
    try { r = await fetchPublicStore(sh.store_slug); } catch (e) { r = null; }
    var items = (r && r.items) || [];
    var list = items.length
      ? '<div class="list">' + items.map(function (p) {
          return '<div class="li"><div class="grow"><div class="t">' + esc(p.name) + '</div><div class="d">' + esc(B.tx('st_in_stock')) + '</div></div><b class="num">' + inrf(p.price) + (p.unit ? ' / ' + esc(p.unit) : '') + '</b></div>';
        }).join('') + '</div>'
      : '<p class="muted">' + esc(B.tx('st_no_items')) + '</p>';
    B.modal('<h2>' + esc(sh.name) + '</h2><p class="muted small mb">' + esc(B.tx('st_preview_sub')) + '</p>' + list);
  };

  /* ---------- 2. Team: the Orders page ---------- */
  var ordStatus = '';
  var lastFetch = 0, lastNew = null;

  B.on('orders', function (v) { renderOrders(v); });

  async function renderOrders(v) {
    var title = B.head(B.tx('ord_title'), B.tx('ord_sub'), '');
    if (!B.can('orders')) { v.innerHTML = title + '<p class="muted">' + esc(B.tx('ord_forbidden')) + '</p>'; return; }
    var r;
    try { r = await B.api('/orders' + (ordStatus ? '?status=' + ordStatus : '')); }
    catch (e) { v.innerHTML = title + '<div class="err">' + esc(e.message) + '</div>'; return; }
    lastNew = r.new_count || 0; lastFetch = Date.now(); paintBadges(lastNew);
    var items = r.items || [];
    var chips = [''].concat(ORDER_STATUSES).map(function (s) {
      return '<button class="btn ' + (ordStatus === s ? '' : 'sec ') + '" data-v2s="filter" data-status="' + s + '">' +
        esc(B.tx(s ? 'ord_' + s : 'ord_all')) + '</button>';
    }).join('');
    v.innerHTML = title + '<div class="ord-chips">' + chips + '</div>' +
      (items.length ? items.map(orderHtml).join('') : '<section class="card"><p class="muted">' + esc(B.tx('ord_none')) + '</p></section>');
  }

  function orderHtml(o) {
    var phone = digits(o.phone);
    var lines = (o.lines || []).map(function (l) {
      return '<li>' + esc(l.name) + ' × ' + esc(B.qn(l.qty)) + (l.unit ? ' ' + esc(l.unit) : '') + ' = ' + inrf(l.line_total) + '</li>';
    }).join('');
    return '<section class="card ord" style="max-width:640px">' +
      '<div class="row sp"><div><b>' + esc(o.name) + '</b><div class="small muted">' + esc(B.tx('ord_ref', { ref: o.ref })) + ' · ' + esc(when(o.created_at)) + '</div></div>' +
      '<span class="badge ' + (o.status === 'new' ? 'amber' : 'gray') + '">' + esc(B.tx('ord_' + o.status)) + '</span></div>' +
      '<div class="small mt">' + esc(o.phone) + ' · ' + esc(B.tx('ord_items', { n: o.item_count })) + ' · <b>' + esc(B.tx('ord_total')) + ' ' + inrf(o.total) + '</b></div>' +
      (lines ? '<ul class="small ord-lines">' + lines + '</ul>' : '') +
      (o.note ? '<p class="small"><b>' + esc(B.tx('ord_note')) + ':</b> ' + esc(o.note) + '</p>' : '') +
      '<div class="row wrap mt"><label class="small" style="flex:1 1 180px">' + esc(B.tx('ord_status')) +
      '<select class="in" data-v2s="status" data-id="' + esc(o.id) + '">' +
      ORDER_STATUSES.map(function (s) { return '<option value="' + s + '"' + (s === o.status ? ' selected' : '') + '>' + esc(B.tx('ord_' + s)) + '</option>'; }).join('') +
      '</select></label>' +
      '<a class="btn sec" target="_blank" rel="noopener" href="' + esc(waUrl(phone, B.tx('ord_reply_text', { name: o.name, ref: o.ref }))) + '">' + esc(B.tx('ord_reply')) + '</a>' +
      '<a class="btn sec" href="tel:' + esc(phone) + '">' + esc(B.tx('ord_call')) + '</a></div></section>';
  }

  document.addEventListener('change', async function (e) {
    var el = e.target.closest && e.target.closest('[data-v2s="status"]'); if (!el) return;
    try {
      await B.api('/orders/' + encodeURIComponent(el.getAttribute('data-id')) + '/status', 'PUT', { status: el.value });
      B.toast(B.tx('ord_saved'));
    } catch (err) { B.toast(err.message); }
    var v = document.getElementById('view');
    if (v && B.S.page === 'orders') renderOrders(v);
    refreshBadge(true);
  });

  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-v2s="filter"]'); if (!el) return;
    ordStatus = el.getAttribute('data-status') || '';
    var v = document.getElementById('view');
    if (v) renderOrders(v);
  });

  // The new-orders badge on the Orders link (sidebar and More list).
  function paintBadges(n) {
    document.querySelectorAll('[data-v2-nav="orders"], [data-v2-more="orders"]').forEach(function (a) {
      var old = a.querySelector('[data-v2-badge]'); if (old) old.parentNode.removeChild(old);
      if (n > 0) {
        var b = document.createElement('span');
        b.className = 'badge amber'; b.setAttribute('data-v2-badge', ''); b.style.marginLeft = 'auto';
        b.textContent = String(n);
        a.appendChild(b);
      }
    });
  }
  function refreshBadge(force) {
    if (!B.S.me || !B.can('orders')) return;
    if (!force && lastNew !== null && Date.now() - lastFetch < 30000) { paintBadges(lastNew); return; }
    lastFetch = Date.now();
    B.api('/orders?status=new').then(function (r) { lastNew = r.new_count || 0; paintBadges(lastNew); }).catch(function () {});
  }
  // Runs after the page is drawn, so the sidebar link exists by then.
  B.on('*', function () { setTimeout(function () { refreshBadge(false); }, 0); });
  setInterval(function () { if (B.S.me) refreshBadge(true); }, 120000);

  /* ---------- 3. Public: the store a buyer opens from the link ---------- */
  var PS = { slug: '', shop: null, items: [], cart: {}, lang: 'en', q: '' };

  function T(k, vars) {
    var d = (window.I18N && window.I18N[PS.lang]) || {};
    var s = d[k] || (window.I18N && window.I18N.en && window.I18N.en[k]) || k;
    if (vars) Object.keys(vars).forEach(function (n) { s = s.split('{' + n + '}').join(vars[n]); });
    return s;
  }
  function $(sel) { return document.querySelector(sel); }

  // Called by app.js on load. Returns true when it took over the page (a store link).
  B.publicStore = function () {
    var slug = (new URLSearchParams(location.search).get('shop') || '').trim();
    if (!slug) return false;
    PS.slug = slug;
    var app = document.getElementById('app');
    app.innerHTML = '<div class="ps"><p class="muted">' + esc(T('pub_loading')) + '</p></div>';
    loadPublic(app);
    return true;
  };

  async function loadPublic(app) {
    var r = null;
    try { r = await fetchPublicStore(PS.slug); } catch (e) {
      app.innerHTML = '<div class="ps"><div class="ps-card">' + esc(T('pub_error')) + '</div></div>';
      return;
    }
    if (!r || !r.found) {
      app.innerHTML = '<div class="ps"><div class="ps-card">' + esc(T('pub_closed')) + '</div></div>';
      return;
    }
    PS.shop = r.shop || {};
    PS.items = r.items || [];
    PS.lang = (window.I18N && window.I18N[PS.shop.lang]) ? PS.shop.lang : 'en';
    document.documentElement.lang = PS.lang;
    document.title = PS.shop.name || 'BizGrow';
    paintPublic(app);
  }

  function paintPublic(app) {
    var sh = PS.shop;
    var phone = sh.phone ? '<a href="tel:' + esc(digits(sh.phone)) + '">' + esc(sh.phone) + '</a>' : '';
    app.innerHTML = '<div class="ps">' +
      '<header><h1>' + esc(sh.name || '') + '</h1><div class="ps-meta">' + esc(sh.city || '') + (sh.city && phone ? ' · ' : '') + phone + '</div></header>' +
      '<p class="ps-intro">' + esc(T('pub_intro')) + '</p>' +
      '<input id="psSearch" class="ps-search" type="search" placeholder="' + esc(T('pub_search')) + '" aria-label="' + esc(T('pub_search')) + '">' +
      '<div id="psList" class="ps-list"></div>' +
      '<section class="ps-card" id="psCart"></section>' +
      '<section class="ps-card" id="psForm">' +
      '<label class="ps-field">' + esc(T('pub_name')) + '<input id="psName" autocomplete="name" maxlength="60"></label>' +
      '<label class="ps-field">' + esc(T('pub_phone')) + '<input id="psPhone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="20"></label>' +
      '<label class="ps-field">' + esc(T('pub_note')) + '<textarea id="psNote" rows="2" maxlength="300"></textarea></label>' +
      '<button id="psSend" class="ps-send" data-ps="send" type="button">' + esc(T('pub_send')) + '</button>' +
      '<div id="psMsg" class="ps-msg" role="alert"></div>' +
      '</section>' +
      '<div id="psDone"></div>' +
      '</div>';
    $('#psSearch').addEventListener('input', function (e) { PS.q = e.target.value; renderList(); });
    renderList(); renderCart();
  }

  function cartQty(id) { return PS.cart[String(id)] || 0; }

  function renderList() {
    var box = $('#psList'); if (!box) return;
    var q = PS.q.trim().toLowerCase();
    var rows = PS.items.filter(function (it) {
      return !q || String(it.name || '').toLowerCase().indexOf(q) >= 0 || String(it.category || '').toLowerCase().indexOf(q) >= 0;
    });
    if (!rows.length) { box.innerHTML = '<p class="muted">' + esc(T('pub_none')) + '</p>'; return; }
    box.innerHTML = rows.map(function (it) {
      var id = esc(String(it.id));
      var per = it.unit ? T('pub_per', { price: inrf(it.price), unit: it.unit }) : inrf(it.price);
      var q2 = cartQty(it.id);
      var ctrl = q2 > 0
        ? '<div class="ps-step"><button type="button" class="ps-btn" data-ps="dec" data-id="' + id + '" aria-label="' + esc(T('pub_less')) + '">−</button>' +
          '<span>' + esc(B.qn(q2)) + '</span><button type="button" class="ps-btn" data-ps="inc" data-id="' + id + '" aria-label="' + esc(T('pub_more')) + '">+</button></div>'

      return '<div class="ps-item"><div class="ps-info"><b>' + esc(it.name) + '</b><small>' + esc(per) + '</small></div>' + ctrl + '</div>';
    }).join('');
  }

  function cartLines() {
    return Object.keys(PS.cart).map(function (k) {
      var item = PS.items.find(function (i) { return String(i.id) === k; });
      return item ? { item: item, qty: PS.cart[k] } : null;
    }).filter(Boolean);
  }

  function renderCart() {
    var box = $('#psCart'); if (!box) return;
    var lines = cartLines();
    if (!lines.length) { box.innerHTML = '<h2>' + esc(T('pub_cart')) + '</h2><p class="muted">' + esc(T('pub_cart_empty')) + '</p>'; return; }
    var total = 0;
    var rows = lines.map(function (l) {
      var lt = Math.round(l.item.price * l.qty * 100) / 100; total += lt;
      return '<div class="ps-line"><div class="ps-grow">' + esc(l.item.name) + ' × ' + esc(B.qn(l.qty)) + (l.item.unit ? ' ' + esc(l.item.unit) : '') +
        ' = <b>' + inrf(lt) + '</b></div><button type="button" class="ps-btn" data-ps="rm" data-id="' + esc(String(l.item.id)) + '">' + esc(T('pub_remove')) + '</button></div>';
    }).join('');
    box.innerHTML = '<h2>' + esc(T('pub_cart')) + ' (' + esc(T('pub_items', { n: lines.length })) + ')</h2>' + rows +
      '<div class="ps-total"><span>' + esc(T('pub_total')) + '</span><span>' + inrf(total) + '</span></div>';
  }

  function setQty(id, qty) {
    var k = String(id);
    if (qty <= 0) delete PS.cart[k]; else PS.cart[k] = Math.min(qty, 9999);
  }

  function showMsg(text) { var m = $('#psMsg'); if (m) m.textContent = text || ''; }

  function buildMessage(ref, name, phone, note, lines, total) {
    var out = [T('pub_wa_head', { ref: ref }), '', T('pub_wa_name') + ': ' + name, T('pub_wa_phone') + ': ' + phone];
    lines.forEach(function (l) {
      out.push('- ' + l.item.name + ' x ' + B.qn(l.qty) + (l.item.unit ? ' ' + l.item.unit : '') + ' = ' + inrf(Math.round(l.item.price * l.qty * 100) / 100));
    });
    out.push(T('pub_wa_total') + ': ' + inrf(total));
    if (note) out.push(T('pub_wa_note') + ': ' + note);
    return out.join('\n');
  }

  async function sendOrder() {
    showMsg('');
    var name = ($('#psName').value || '').trim();
    var phone = digits($('#psPhone').value);
    var note = ($('#psNote').value || '').trim();
    var lines = cartLines();
    if (!lines.length) return showMsg(T('pub_need_items'));
    if (name.length < 2) return showMsg(T('pub_need_name'));
    if (phone.length < 10 || phone.length > 13) return showMsg(T('pub_need_phone'));

    // Open the WhatsApp window now, inside the tap, so phones do not block it.
    var w = null; try { w = window.open('', '_blank'); } catch (e) { w = null; }
    var btn = $('#psSend'); btn.disabled = true; btn.textContent = T('pub_sending');
    var reset = function () { btn.disabled = false; btn.textContent = T('pub_send'); };

    var res, data = {};
    try {
      res = await fetch('/api/public/order', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ shop: PS.slug, name: name, phone: phone, note: note,
          items: lines.map(function (l) { return { product_id: l.item.id, qty: l.qty }; }) })
      });
      data = await res.json().catch(function () { return {}; });
    } catch (e) {
      if (w && !w.closed) w.close();
      reset(); return showMsg(T('pub_error'));
    }
    if (!res.ok || !data.ok) {
      if (w && !w.closed) w.close();
      reset(); return showMsg(data.error || T('pub_error'));
    }

    var total = data.total != null ? data.total : 0;
    var url = waUrl(PS.shop.phone, buildMessage(data.ref, name, phone, note, lines, total));
    if (w && !w.closed) { try { w.location.href = url; } catch (e) { /* the button below still works */ } }
    PS.cart = {};
    renderList(); renderCart(); reset();
    $('#psDone').innerHTML = '<div class="ps-done"><b>' + esc(T('pub_sent', { ref: data.ref })) + '</b><br>' +
      '<a class="ps-wa" target="_blank" rel="noopener" href="' + esc(url) + '">' + esc(T('pub_send')) + '</a></div>';
    $('#psDone').scrollIntoView ? $('#psDone').scrollIntoView({ block: 'center' }) : null;
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-ps]'); if (!el) return;
    var act = el.getAttribute('data-ps');
    var id = el.getAttribute('data-id');
    if (act === 'send') { sendOrder(); return; }
    var cur = cartQty(id);
    if (act === 'add' || act === 'inc') setQty(id, cur + 1);
    else if (act === 'dec') setQty(id, cur - 1);
    else if (act === 'rm') setQty(id, 0);
    else return;
    renderList(); renderCart();
  });
})();

/* BizGrow v2: real sign-in and shop data through Supabase (stage 1).

  var PATCH_NOTE = 'This needs one database update first. Run the update in Supabase once, then try again.';

    // Suppliers: read only (writes are in the next stage)

        dash.yesterday = { sales: num(y.sales), bills: num(y.bills) };

      } else {

        dash.yesterday.bills = await countOf(sb.from('bills').select('id', { count: 'exact', head: true }).eq('sale_date', yest).is('deleted_at', null));
      }

    }
    if (path === '/reports' && method === 'GET') {
      moneyOnly();
      var days = Math.max(1, Math.min(366, parseInt((qs && qs.get('days')) || '7', 10) || 7));
      var rFrom = addDays(today, -(days - 1));
      var bl = await q(sb.from('bills').select('total,sale_date,bill_items(name,amount,cost,qty)').is('deleted_at', null).gte('sale_date', rFrom).lte('sale_date', today));
      var ex = await q(sb.from('expenses').select('amount,category').is('deleted_at', null).gte('spent_on', rFrom).lte('spent_on', today));
      var rev = 0, cost = 0, expT = 0, byDay = {}, byName = {}, byCat = {};
      bl.forEach(function (x) {
        rev += num(x.total); byDay[x.sale_date] = (byDay[x.sale_date] || 0) + num(x.total);

      var all = await Promise.all(['shops', 'signup_answers', 'consent_records', 'staff', 'products', 'payments', 'expenses', 'tasks', 'suppliers', 'audit_log']

    document.body.appendChild(l); l.click(); l.remove();

  }

  // Capture-phase click on export and invoice links. The mock version of this listener stands down in real mode.
  document.addEventListener('click', function (ev) {
    var t = ev.target, a = t && t.closest ? t.closest('a[href^="/api/export"], a[href^="/api/invoice"]') : null;
    if (!a) return;
    ev.preventDefault(); ev.stopImmediatePropagation();
    var u = new URL(a.getAttribute('href'), location.origin);
    var parts = u.pathname.split('/'); // ['', 'api', 'export', table] or ['', 'api', 'invoice', id]
    var pdf = u.searchParams.get('format') === 'pdf';
    var win = (pdf || parts[2] === 'invoice') ? window.open('', '_blank') : null;
    (async function () {
      if (parts[2] === 'invoice') {
        if (!win) throw new Error('Allow pop-ups for this site to see the bill.');
        printPage(win, 'Bill', await invoiceHtml(parts[3]));
        return;
      }
      var kind = EXPORTS[parts[3]];
      if (!kind) throw new Error('This comes in the next stage. Nothing was changed.');
      var s = await session(), st = s && await loadStaff(s.user.id);
      if (!st || st.role !== 'owner') throw new Error('Only the owner can do this.');
      var rows = await kind.get(st.shop_id);
      if (pdf) {
        if (!win) throw new Error('Allow pop-ups for this site to see the file.');
        printPage(win, parts[3], tableHtml(kind.head, rows));
      } else {
        download('bizgrow-' + parts[3] + '.csv', csvOf([kind.head].concat(rows)), 'text/csv;charset=utf-8');
      }
    })().catch(function (e) {
      if (win) win.close();
      B.toast((e && e.message) || 'Something went wrong. Please try again.');
    });
  }, true);

  // Every /api call the screens make. Returns a Response.
  async function realApi(path, method, body, qs) {
    if (path === '/config') return reply(200, { reset_email: false });
    if (path === '/me') {
      var me;
      try { me = await getMe(); }
      catch (e) {
        var sess = await session();
        if (sess) { B.toast('Google sign-in worked, but your shop could not be opened. The database setup may be missing. Code: ' + String((e && e.message) || e).slice(0, 80)); }
        return fail(401, SIGN_IN);
      }
      return me ? reply(200, me) : fail(401, SIGN_IN);
    }
    if (path === '/logout' && method === 'POST') { await sb.auth.signOut(); return reply(200, { ok: true }); }

    // Public online store (patch-06). Anyone with the store link can read it and send an order. No sign-in.
    if (path === '/public/store' && method === 'GET') {
      return reply(200, await rpc('public_store_catalogue', { p_slug: txt(qs && qs.get('shop')) }));
    }
    if (path === '/public/order' && method === 'POST') {
      var ob = body || {};
      return reply(200, await rpc('place_store_order', { p_slug: txt(ob.shop), p_name: txt(ob.name), p_phone: txt(ob.phone),
        p_note: txt(ob.note), p_items: Array.isArray(ob.items) ? ob.items : [] }));
    }
    if (/^\/(login|password|invite)/.test(path) || path === '/signup') {
      return fail(400, path.indexOf('/invite') === 0 ? 'This invite link is not valid.' : 'Sign in with Google. Email and password are not used here.');
    }

    var s = await session();
    if (!s) return fail(401, SIGN_IN);
    var uid = s.user.id;
    var st = await loadStaff(uid);
    if (!st) return fail(401, SIGN_IN);
    var shopId = st.shop_id, owner = st.role === 'owner';

    // Sign-up answers, consent and shop settings (the part that is real in stage 1).
    if (path === '/consent' && method === 'POST') {
      var granted = !!(body && body.granted), at = nowIso();
      dataOf(await sb.from('consent_records').insert({ auth_user_id: uid, shop_id: shopId, granted: granted, text_version: CONSENT_VERSION, granted_at: at }));
      return reply(200, { ok: true, consent: { granted: granted, at: at, text_version: CONSENT_VERSION } });
    }
    if (path === '/signup/answers' && method === 'PUT') {
      var part = (body && body.answers) || {}, fields = {};
      ANSWER_KEYS.forEach(function (k) { if (part[k] !== undefined) fields[k] = part[k] === '' ? null : part[k]; });
      var rec = Object.assign({}, fields, { shop_id: shopId, updated_at: nowIso() });
      if (body && body.done) rec.done = true;
      var existing = await loadSignup(uid);
      if (existing) dataOf(await sb.from('signup_answers').update(rec).eq('id', existing.id));
      else dataOf(await sb.from('signup_answers').insert(Object.assign(rec, { auth_user_id: uid })));
      if (fields.shop_name !== undefined || fields.trade !== undefined || fields.city !== undefined) {
        dataOf(await sb.rpc('update_my_shop', { p_shop: shopId, p_name: fields.shop_name || null, p_trade: fields.trade || null, p_city: fields.city || null, p_lang: null }));
      }
      return reply(200, { ok: true, signup_done: !!(body && body.done) });
    }
    if (path === '/language' && method === 'PUT') {
      if (owner && body && body.lang) dataOf(await sb.rpc('update_my_shop', { p_shop: shopId, p_name: null, p_trade: null, p_city: null, p_lang: body.lang }));
      return reply(200, { ok: true });
    }
    if (path === '/business' && method === 'PUT') {
      if (!owner) return fail(400, 'Only the owner can change the shop.');
      var b = body || {};
      dataOf(await sb.rpc('update_my_shop', { p_shop: shopId, p_name: b.name || null, p_trade: b.trade || null, p_city: b.city || null, p_lang: b.lang || null }));
      // The store button sends the whole shop back, so a missing database update must not block it.
      try { await saveProfile(shopId, { phone: b.phone, upi_id: b.upi_id, address: b.address }, 'Phone, UPI ID and address'); }
      catch (e) { if (/cannot be saved yet/.test(e.message)) return reply(200, { ok: true, warning: e.message }); throw e; }
      return reply(200, { ok: true });
    }
    // Business type (patch-04). Until that update is run, the app keeps the choice on the phone and says so.
    if (path === '/business-type' && method === 'PUT') {
      if (!owner) return fail(400, 'Only the owner can change the shop.');
      var bt = String((body && body.business_type) || '').trim() || null;
      try { dataOf(await sb.rpc('update_my_business_type', { p_shop: shopId, p_type: bt })); }
      catch (e) { if (e.message === PATCH_NOTE) return reply(200, { ok: true, saved_here: true }); throw e; }
      return reply(200, { ok: true, business_type: bt || '' });
    }
    if (path === '/v2/settings' && method === 'PUT') {
      if (!owner) return fail(400, 'Only the owner can change settings.');
      var sv = body || {};
      if (sv.assistant_name == null) return reply(200, { ok: true });
      var an = String(sv.assistant_name).trim();
      await saveProfile(shopId, { assistant_name: an }, 'The assistant name');
      return reply(200, { ok: true, assistant_name: an });
    }
    if ((path === '/onboarding' && method === 'PUT') || (path === '/starter' && method === 'POST')) return reply(200, { ok: true });

    // Shop data (stage 2): items, people, sales, expenses, tasks, reports, audit, staff and privacy.
    var shopRes = await shopRoute(path, method, body, qs, st);
    if (shopRes) return shopRes;

    // Later-stage reads: an empty list until they are built.
    if (method === 'GET' && !/^\/(v2\/export|privacy\/download)/.test(path)) return reply(200, { items: [] });

    // Later-stage writes and exports: a plain message, nothing changed.
    return fail(400, COMING);
  }

  // Keep the page's own fetch calls to the same "/api" addresses; answer them here.
  var baseFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : ((input && input.url) || '');
    if (url.indexOf('/api/') !== 0) return baseFetch(input, init);
    var u = new URL(url, location.origin);
    var path = u.pathname.slice(4);
    var method = ((init && init.method) || 'GET').toUpperCase();
    var body = null;
    if (init && init.body) { try { body = JSON.parse(init.body); } catch (e) { body = null; } }
    return realApi(path, method, body, u.searchParams).catch(function (e) {
      return fail(400, (e && e.message) || 'Something went wrong. Please try again.');
    });
  };

  // Google sign-in. Comes back to this same page address after the Google step.
  B.ACT['google-signin'] = async function () {
    if (location.protocol === 'file:') {
      B.toast('Google sign-in works only on the live website address. Open that address to sign in.');
      return;
    }
    var r = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
    if (r && r.error) throw new Error('Could not start Google sign-in. Please try again.');
  };

  // Called by app.js on the sign-in screen: keep only the Google button and the terms.
  B.authDone = function () {
    var box = document.querySelector('.auth .box');
    if (!box) return;
    box.querySelectorAll('form, .auth-switch, .or').forEach(function (el) { el.remove(); });
    var g = box.querySelector('.gbtn');
    if (g) {
      g.removeAttribute('disabled'); g.removeAttribute('aria-disabled'); g.removeAttribute('title');
      g.classList.add('big');
      g.setAttribute('data-act', 'google-signin');
      var em = g.querySelector('em'); if (em) em.remove();
    }
  };

  // First sign-up step for a new owner: ask for consent before the six questions. Unticked by default.
  function consentScreen() {
    var link = '<a href="#" data-act="privacy-notice">' + esc(B.tx('privacy_link')) + '</a>';
    document.documentElement.lang = B.S.lang;
    $('#app').innerHTML = '<div class="su-wrap"><div class="su-box rc-box">' +
      '<div class="su-top"><div class="su-brand">BizGrow</div></div>' +
      '<h2 class="su-title">' + esc(B.tx('pv_consent_title')) + '</h2>' +
      '<label class="chk rc-chk"><input type="checkbox" id="rcOk"><span>' + B.tx('consent_text').replace('{p}', link) + '</span></label>' +
      '<button type="button" class="btn block" id="rcGo" disabled data-act="real-consent">' + esc(B.tx('su_next')) + '</button>' +
      '<div class="su-out"><button type="button" class="linkbtn" data-act="logout">' + esc(B.tx('su_signout')) + '</button></div>' +
      '</div></div>';
    var cb = document.getElementById('rcOk'), go = document.getElementById('rcGo');
    cb.onchange = function () { go.disabled = !cb.checked; };
  }
  B.ACT['real-consent'] = async function () {
    var cb = document.getElementById('rcOk');
    if (!cb || !cb.checked) return;
    await B.api('/consent', 'POST', { granted: true });
    B.S.me = await B.api('/me');
    B.render();
  };
  var baseGate = B.gate;
  B.gate = function () {
    var me = B.S.me;
    if (me && me.signup_done === false && !(me.consent && me.consent.granted)) { consentScreen(); return true; }
    return baseGate ? baseGate() : false;
  };
})();

</script></body></html>
