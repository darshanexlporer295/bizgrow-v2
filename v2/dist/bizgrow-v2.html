<style>

:root{--navy:#0A192F;--primary:#0F254A;--accent:#1E3A8A;--saffron:#F59E0B;--bg:#F4F6FA;--card:#fff;--line:#E3E8F0;--text:#0F172A;--mut:#64748B;--danger:#DC2626;--warn:#B45309;--ok:#1E3A8A;--r:14px;--shadow:0 1px 2px rgba(15,37,74,.06),0 4px 14px rgba(15,37,74,.06)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{font-family:Inter,"Noto Sans Devanagari","Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:"Plus Jakarta Sans",Inter,"Noto Sans Devanagari","Noto Sans Gujarati",system-ui,sans-serif;letter-spacing:-.02em}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
.hide{display:none!important}
/* shell */
.shell{display:flex;min-height:100%}
.side{width:236px;background:var(--navy);color:#CBD5E1;padding:20px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:19px;padding:4px 10px 22px;font-family:"Plus Jakarta Sans",Inter,"Noto Sans Devanagari","Noto Sans Gujarati",sans-serif}
.brand small{display:block;font-weight:500;font-size:11px;color:#94A3B8;letter-spacing:.02em;margin-top:1px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#CBD5E1;font-weight:500;font-size:14.5px;margin-bottom:2px}
.nav a svg{width:19px;height:19px;flex:none;opacity:.9}
.nav a.on{background:rgba(255,255,255,.1);color:#fff}
.nav a:hover{background:rgba(255,255,255,.06)}
.side .who{margin-top:auto;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.side .who b{display:block;color:#fff;font-weight:600}
.side .who button{color:#94A3B8;font-size:13px;margin-top:6px;padding:0}
.main{margin-left:236px;flex:1;min-width:0;padding:26px 32px 60px;max-width:1180px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:25px;font-weight:700}.top p{color:var(--mut);font-size:14px;margin-top:2px}
.tabbar{display:none}
/* cards & grid */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:16px;font-weight:700;margin-bottom:12px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.7fr 1fr}
.kpi .k{font-size:13px;color:var(--mut);font-weight:500}.kpi .v{font-size:27px;font-weight:700;margin-top:4px}.kpi .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.up{color:var(--accent);font-weight:600}.dn{color:var(--danger);font-weight:600}
.mt{margin-top:14px}.mb{margin-bottom:14px}.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.muted{color:var(--mut)}.small{font-size:13px}.bold{font-weight:600}.right{text-align:right}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;padding:11px 18px;border-radius:11px;font-weight:600;font-size:14.5px;min-height:44px;transition:background .15s}
.btn:hover{background:var(--navy)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--primary);border:1px solid var(--line)}.btn.sec:hover{background:#F8FAFC}
.btn.warn{background:var(--saffron);color:#1B1305}.btn.warn:hover{background:#E08E00}
.btn.red{background:#fff;color:var(--danger);border:1px solid #FECACA}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:9px}.btn.block{width:100%}
.link{color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}
/* forms */
label{display:block;font-size:13px;font-weight:600;color:#334155;margin:0 0 5px}
.in{width:100%;padding:11px 13px;border:1px solid #CBD5E1;border-radius:10px;background:#fff;min-height:44px;outline:none}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,58,138,.14)}
.f{margin-bottom:13px}.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.err{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px}
.okmsg{background:#EFF6FF;color:#1E3A8A;border:1px solid #BFDBFE;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px}
/* badges & lists */
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#E8EEF9;color:var(--accent)}
.badge.red{background:#FEE2E2;color:#991B1B}.badge.amber{background:#FEF3C7;color:#92400E}.badge.gray{background:#EEF2F6;color:#475569}
.list>.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.list>.li:last-child{border:0}
.li .t{font-weight:600}.li .d{font-size:13px;color:var(--mut)}
.avatar{width:40px;height:40px;border-radius:50%;background:#E8EEF9;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mut);font-weight:600;font-size:12.5px;padding:8px 8px;border-bottom:1px solid var(--line)}td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}

    $('#obx',o).innerHTML=`<div class="row sp mb small muted"><span>Step ${step+1} of ${steps.length}</span><button class="link" data-ob-skip>Skip for now</button></div><div class="obbar"><i style="width:${(step+1)/steps.length*100}%"></i></div>${steps[step]()}<div class="row mt">${step?'<button class="btn sec" data-ob-back>Back</button>':''}<button class="btn grow" data-ob-next>${last?'Finish':'Next'}</button></div>`;
  };
  A.category=S.me.shop.category||'kirana';
  o.addEventListener('click',async e=>{
    const b=e.target.closest('[data-ob]');
    if(b){const n=b.dataset.ob,v=b.dataset.v;if(n==='problems'){const i=A.problems.indexOf(v);i>=0?A.problems.splice(i,1):A.problems.push(v);}else A[n]=v;draw();return;}
    if(e.target.closest('[data-ob-back]')){step--;draw();return;}
    if(e.target.closest('[data-ob-skip]')){sessionStorage.setItem('bg_skipob','1');await api('/onboarding','PUT',{skipped:true,category:A.category}).catch(()=>{});o.close();return;}
    if(e.target.closest('[data-ob-next]')){
      if(step<steps.length-1){step++;draw();return;}
      const btn=e.target.closest('[data-ob-next]');btn.disabled=true;
      try{
        await api('/onboarding','PUT',{...A,phone:$('#ob-phone',o).value,upi_id:$('#ob-upi',o).value});
        if($('#ob-kit',o)&&$('#ob-kit',o).checked){const have=await api('/products');if(!have.items.length)await api('/starter','POST',{kit:A.category});}
        S.me=await api('/me');o.close();toast('You are all set 🎉');render();
      }catch(err){btn.disabled=false;toast(err.message);}
    }
  });
  draw();
}

/* ---------- on-screen translation for literal English phrases (hi, mr, gu) ---------- */
const TXC={};
function txPattern(lang){
  if(TXC[lang]!==undefined)return TXC[lang];
  const d=(window.I18N_TX||{})[lang];
  if(!d){TXC[lang]=null;return null;}
  const keys=Object.keys(d).sort((x,y)=>y.length-x.length);
  const re=new RegExp(keys.map(k=>'(?<![A-Za-z])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-z])').join('|'),'g');
  TXC[lang]={d,re};return TXC[lang];
}
function txText(s){const P=txPattern(S.lang);if(!P||!/[A-Za-z]/.test(s))return s;return s.replace(P.re,m=>P.d[m]||m);}
function txNode(root){
  if(!root||S.lang==='en'||!txPattern(S.lang))return;
  if(root.nodeType===3){const v=root.nodeValue;const nv=txText(v);if(nv!==v)root.nodeValue=nv;return;}
  if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>(n.parentNode&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const list=[];let n;while((n=w.nextNode()))list.push(n);
  for(const x of list){const v=x.nodeValue;const nv=txText(v);if(nv!==v)x.nodeValue=nv;}
  root.querySelectorAll&&root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>{for(const at of ['placeholder','aria-label','title']){const v=el.getAttribute(at);if(v&&/[A-Za-z]/.test(v)){const nv=txText(v);if(nv!==v)el.setAttribute(at,nv);}}});
}
new MutationObserver(ms=>{if(S.lang==='en')return;for(const m of ms)for(const nd of m.addedNodes)txNode(nd);}).observe(document.body,{childList:true,subtree:true});

/* ---------- barcode scan: camera (BarcodeDetector, or ZXing when missing) with typed fallback ---------- */
const ZXING_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
let zxingP=null;
function loadZXing(){if(window.ZXing)return Promise.resolve(window.ZXing);if(!zxingP)zxingP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=ZXING_URL;s.onload=()=>window.ZXing?res(window.ZXing):rej(new Error('scanner'));s.onerror=()=>rej(new Error('scanner'));document.head.appendChild(s);});return zxingP;}
function openScanner({title,onCode}){
  let stream=null,timer=null,reader=null,closed=false,last='',lastAt=0;
  function stop(){closed=true;clearInterval(timer);try{reader&&reader.reset();}catch(e){}if(stream)stream.getTracks().forEach(t=>t.stop());}
  const o=modal(`<h2>${esc(title||t('scan_title'))}</h2>
    <div class="scanbox"><video id="scanv" playsinline muted autoplay></video><div class="scanline"></div></div>
    <p class="small muted" id="scanmsg">${t('scan_starting')}</p>
    <div class="f"><label>${t('scan_or_type')}</label><div class="row"><input class="in grow" style="min-width:0" id="scan-manual" autocomplete="off" placeholder="${t('scan_type_ph')}"><button type="button" class="btn" style="flex:none" data-scan-use>${t('scan_use')}</button></div></div>
    <div class="row mt"><button type="button" class="btn sec block" data-scan-close>${t('scan_done')}</button></div>`,{onclose:stop});
  const msg=m=>{const e=$('#scanmsg',o);if(e)e.textContent=m;};
  const video=$('#scanv',o);
  function emit(code){
    code=String(code||'').trim();if(!code)return;
    const now=Date.now();const same=code===last&&now-lastAt<1200;last=code;lastAt=now;
    if(same)return;
    onCode(code);
  }
  o.querySelector('[data-scan-close]').onclick=()=>o.close();
  const use=()=>{const i=$('#scan-manual',o);const v=i.value.trim();if(v){i.value='';emit(v);i.focus();}};
  o.querySelector('[data-scan-use]').onclick=use;
  $('#scan-manual',o).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();use();}});
  (async()=>{
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){msg(t('scan_no_device'));return;}
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});}
    catch(err){const n=err&&err.name;msg(n==='NotAllowedError'||n==='PermissionDeniedError'?t('scan_denied'):(n==='NotFoundError'||n==='OverconstrainedError')?t('scan_no_cam'):t('scan_cam_fail'));return;}
    if(closed){stream.getTracks().forEach(tr=>tr.stop());return;}
    video.srcObject=stream;try{await video.play();}catch(e){}
    msg(t('scan_point'));
    if('BarcodeDetector' in window){
      let det;try{det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code','itf']});}catch(e){det=new BarcodeDetector();}
      timer=setInterval(async()=>{if(closed||video.readyState<2)return;try{const r=await det.detect(video);if(r.length)emit(r[0].rawValue);}catch(e){}},350);
    }else{
      msg(t('scan_loading'));
      try{const Z=await loadZXing();if(closed)return;const rd=new Z.MultiFormatReader();const cv=document.createElement('canvas');const cx=cv.getContext('2d',{willReadFrequently:true});msg(t('scan_point'));
        timer=setInterval(()=>{if(closed||video.readyState<2||!video.videoWidth)return;cv.width=video.videoWidth;cv.height=video.videoHeight;cx.drawImage(video,0,0);
          try{const res=rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv))));emit(res.getText());}catch(e){}},300);
      }catch(e){if(!closed)msg(t('scan_lib_fail'));}
    }
  })();
  return o;
}

/* ---------- reminders: click-to-send batch (no WhatsApp Business account needed; the user taps Send in WhatsApp) ---------- */
const REM_TPL={polite:'wa_reminder',firm:'rem_firm',friendly:'rem_friendly'};
const REM_TPL_NAME={polite:'Polite',firm:'Firm',friendly:'Friendly'};
const remKey=()=>'bg_rem_'+new Date().toISOString().slice(0,10);
function remText(tpl,c,amt){const base=t(REM_TPL[tpl]).replace('{name}',c.name).replace('{shop}',S.me.shop.name).replace('{amount}',inr(amt));const up=S.me.shop.upi_id?t('wa_upi').replace('{upi}',S.me.shop.upi_id)+' ':'';return base+' '+up+t('m_thanks');}
async function pReminders(v){
  await loadCustomers();
  const tpl=S.remTpl&&REM_TPL[S.remTpl]?S.remTpl:'polite';
  const rows=S.customers.filter(c=>c.balance>0).sort((a,b)=>b.balance-a.balance);
  const opened=JSON.parse(localStorage.getItem(remKey())||'[]');
  const days=c=>c.last_credit?Math.floor((Date.now()-new Date(c.last_credit))/864e5):null;
  v.innerHTML=head('Send reminders','Open WhatsApp with each message ready, then tap Send there.')+
   `<div class="card mb"><p class="small">BizGrow opens WhatsApp with the message ready. You tap Send in WhatsApp. Sending on its own needs a WhatsApp Business account, which BizGrow does not use yet.</p>
    <div class="row wrap mt">${Object.keys(REM_TPL).map(k=>`<button class="btn sm ${k===tpl?'':'sec'}" data-act="rtpl" data-k="${k}">${REM_TPL_NAME[k]}</button>`).join('')}</div></div>
   <div class="card">${rows.length?`<div class="small muted mb">${opened.length} of ${rows.length} opened today</div><div class="list">${rows.map(c=>{const d=days(c);const done=opened.includes(c.id);
     return `<div class="li"><div class="grow"><div class="t">${esc(c.name)}</div><div class="d">${inr(c.balance)}${d!=null&&d>=1?` · ${d} day${d>1?'s':''} since last udhar`:''}</div></div>${c.phone?`<a class="btn sm ${done?'sec':''}" target="_blank" rel="noopener" data-rem="${c.id}" href="${waLink(c.phone,remText(tpl,c,c.balance))}">${done?'Opened':'Open WhatsApp'}</a>`:`<a class="btn sec sm" href="#/khata/${c.id}">Add phone</a>`}</div>`;}).join('')}</div>`
     :emptyBox('Nobody owes you right now','Reminders show here when a customer has udhar pending.','<a class="btn sec" href="#/khata">Back to khata</a>')}</div>`;
}
ACT.rtpl=el=>{S.remTpl=el.dataset.k;render();};
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[data-rem]');if(!a)return;const k=remKey();const arr=JSON.parse(localStorage.getItem(k)||'[]');if(!arr.includes(a.dataset.rem)){arr.push(a.dataset.rem);localStorage.setItem(k,JSON.stringify(arr));}a.textContent='Opened';a.classList.add('sec');});

async function pKhata(v,args){
  if(args[0]==='reminders')return pReminders(v);
  if(args[0])return pCustomer(v,args[0]);
  await loadCustomers();
  const tot=S.customers.reduce((s,c)=>s+Math.max(0,c.balance),0);
  const list=[...S.customers].sort((a,b)=>b.balance-a.balance);
  v.innerHTML=head(t('khata'),'Money your customers owe you',`${tot>0?'<a class="btn sec" href="#/khata/reminders">Send reminders</a>':''}<button class="btn" data-act="newcust">+ ${t('customer')}</button>`)+
   `<div class="card kpi mb"><div class="k">${t('to_collect')}</div><div class="v num">${inr(tot)}</div></div>
   <div class="card"><input class="in mb" id="kq" placeholder="${t('search')}…">${list.length?`<div class="list" id="kl"></div>`:emptyBox('No customers yet','Add customers to keep their udhar (credit) record.','<button class="btn" data-act="newcust">Add customer</button>')}</div>${revoCard('khata')}`;
  const draw=()=>{const q=($('#kq').value||'').toLowerCase();const el=$('#kl');if(!el)return;el.innerHTML=list.filter(c=>c.name.toLowerCase().includes(q)||(c.phone||'').includes(q)).map(c=>{

  const to=today(),from=new Date(Date.now()+IST-29*864e5).toISOString().slice(0,10);
  const e=(await api(`/expenses?from=${from}&to=${to}`)).items;
  const todayT=e.filter(x=>x.date===to).reduce((s,x)=>s+x.amount,0),monthT=e.reduce((s,x)=>s+x.amount,0);
  v.innerHTML=head(t('expenses'),'Everything you spend on the shop',`<button class="btn" data-act="addexp">+ Add expense</button>`)+
   `<div class="grid g2 mb"><div class="card kpi"><div class="k">${t('today')}</div><div class="v num">${inr(todayT)}</div></div><div class="card kpi"><div class="k">Last 30 days</div><div class="v num">${inr(monthT)}</div></div></div>
   <div class="card">${e.length?`<div class="list">${e.map(x=>`<div class="li"><div class="grow"><div class="t">${esc(x.category)}</div><div class="d">${x.date.slice(8)}/${x.date.slice(5,7)} · ${x.method==='upi'?'UPI':'Cash'}${x.note?' · '+esc(x.note):''}</div></div><b>${inr(x.amount)}</b><button class="link" style="color:var(--danger)" data-act="delexp" data-id="${x.id}" aria-label="delete">✕</button></div>`).join('')}</div>`:emptyBox('No expenses yet','Add rent, milk, wages, electricity — so your profit is correct.','<button class="btn" data-act="addexp">Add expense</button>')}</div>`;
}
ACT.scanbill=()=>openScanner({title:t('scan_bill_title'),onCode:code=>{
  const hit=S.products.find(p=>p.sku&&p.sku.trim().toLowerCase()===code.toLowerCase());
  if(!hit){toast(t('scan_not_found').replace('{code}',code));return;}
  addToCart(hit.id);drawTiles();toast(t('scan_added').replace('{name}',hit.name));
}});

/* ---------- reports ---------- */
async function pReports(v){
  const [r,z]=await Promise.all([api('/reports?days='+S.repDays),api('/zreport')]);
  const days=[];for(let i=S.repDays-1;i>=0;i--){const d=new Date(Date.now()+IST-i*864e5).toISOString().slice(0,10);const f=r.daily.find(x=>x.d===d);days.push({d,s:f?f.sales:0});}
  const max=Math.max(1,...days.map(x=>x.s));const show=S.repDays<=14?days:days.filter((_,i)=>i%Math.ceil(days.length/14)===0);
  const topMax=Math.max(1,...r.top.map(x=>x.revenue)),exMax=Math.max(1,...r.expenses_by_category.map(x=>x.amount));
  v.innerHTML=head(t('reports'),'How your shop is doing',`<div class="chips" style="margin:0"><button class="chip ${S.repDays===7?'on':''}" data-act="rdays" data-d="7">${t('week')}</button><button class="chip ${S.repDays===30?'on':''}" data-act="rdays" data-d="30">${t('month')}</button><button class="chip ${S.repDays===90?'on':''}" data-act="rdays" data-d="90">90 days</button></div>`)+
  `<div class="grid g4 mb"><div class="card kpi"><div class="k">${t('revenue')}</div><div class="v num">${inr(r.totals.revenue)}</div><div class="s">${r.totals.bills} ${r.totals.bills===1?'bill':'bills'}</div></div>
   <div class="card kpi"><div class="k">${t('expenses')}</div><div class="v num">${inr(r.totals.expenses)}</div></div>
   ${r.totals.profit!==null?`<div class="card kpi"><div class="k">Profit</div><div class="v num ${r.totals.profit<0?'dn':''}">${inr(r.totals.profit)}</div><div class="s">After cost of items</div></div>`:''}
   <div class="card kpi"><div class="k">Average bill</div><div class="v num">${inr(r.totals.bills?r.totals.revenue/r.totals.bills:0)}</div></div></div>
  <div class="grid g21 mb"><div class="card"><h3>Daily sales</h3><div class="bars">${show.map(x=>`<div class="b" title="${inr(x.s)}"><i style="height:${Math.round(x.s/max*140)}px"></i><small>${x.d.slice(8)}</small></div>`).join('')}</div></div>
   <div class="card"><h3>${t('top_items')}</h3>${r.top.length?r.top.map(x=>`<div class="hb"><div class="row sp small"><span>${esc(x.name)}</span><b>${inr(x.revenue)}</b></div><div class="bar"><i style="width:${x.revenue/topMax*100}%"></i></div></div>`).join(''):'<div class="muted small">No sales in this period yet.</div>'}</div></div>
  <div class="grid g2 mb"><div class="card"><h3>${t('expense_split')}</h3>${r.expenses_by_category.length?r.expenses_by_category.map(x=>`<div class="hb s"><div class="row sp small"><span>${esc(x.category)}</span><b>${inr(x.amount)}</b></div><div class="bar"><i style="width:${x.amount/exMax*100}%"></i></div></div>`).join(''):'<div class="muted small">No expenses in this period.</div>'}</div>
   <div class="card"><h3>${t('day_end')} · ${z.date.slice(8)}/${z.date.slice(5,7)}</h3>
    <div class="list small"><div class="li"><span class="grow">${t('bills')}</span><b>${z.bills}</b></div><div class="li"><span class="grow">Total sales</span><b>${inr(z.total)}</b></div><div class="li"><span class="grow">Cash sales</span><b>${inr(z.cash_sales)}</b></div><div class="li"><span class="grow">UPI sales</span><b>${inr(z.upi_sales)}</b></div><div class="li"><span class="grow">Given on udhar</span><b>${inr(z.credit_given)}</b></div><div class="li"><span class="grow">Udhar cash received</span><b>${inr(z.udhar_cash)}</b></div><div class="li"><span class="grow">Cash expenses</span><b>−${inr(z.expenses_cash)}</b></div><div class="li"><span class="grow bold">${t('cash_in_hand')}</span><b class="num" style="font-size:18px">${inr(z.cash_in_hand)}</b></div></div>
    <div class="row mt"><button class="btn sec sm" onclick="window.print()">${t('print')}</button><a class="btn sm" target="_blank" rel="noopener" href="${waLink(S.me.shop.phone,`*${z.shop}* — ${t('day_end')} ${z.date}\n${t('bills')}: ${z.bills}\n${t('revenue')}: ${inr(z.total)} (${t('cash')} ${inr(z.cash_sales)}, UPI ${inr(z.upi_sales)})\n${t('m_udhar_given')}: ${inr(z.credit_given)}\n${t('expenses')}: ${inr(z.expenses)}\n*${t('cash_in_hand')}: ${inr(z.cash_in_hand)}*`)}">${t('share_whatsapp')}</a></div></div></div>

/* BizGrow v2 layer: shared helpers and the one hook every v2 feature uses.

(function () {
  'use strict';
  var B = window.BGV2;
  if (!B) return;
  var list = [];

  // Each feature file calls V2.on(pages, fn). fn(view, args, page) runs after that page renders.
  B.on = function (pages, fn) { list.push({ pages: pages, fn: fn }); };
  B.after = function (page, view, args) {
    list.forEach(function (h) {
      if (h.pages === '*' || h.pages.indexOf(page) >= 0) {
        try { h.fn(view, args || [], page); } catch (e) { /* a broken add-on must not break the page */ }
      }
    });
    addNavLinks();
  };

  // Text in the member's language, with {name}-style slots filled in. Falls back to English.
  B.tx = function (k, vars) {
    var d = (window.I18N && window.I18N[B.S.lang]) || {};
    var s = d[k] || (window.I18N && window.I18N.en && window.I18N.en[k]) || k;
    if (vars) Object.keys(vars).forEach(function (n) { s = s.split('{' + n + '}').join(vars[n]); });
    return s;
  };
  B.qn = function (n) { return (Math.round((+n || 0) * 1000) / 1000).toString(); };

    manager: ['sale', 'sale.edit', 'sale.delete', 'discount', 'backdate', 'product', 'customer', 'payment', 'expense', 'task', 'supplier', 'view_money', 'audit', 'audit.undo', 'summary'],

</script><script>
/* BizGrow v2: front-end checks. Numbers must be positive numbers, text in a number box shows an error (never 0),
   discount cannot be more than the bill, names have a length limit, and a bill has at most 30 lines.
   The demo server checks the same things again. */
(function () {
  'use strict';
  var B = window.BGV2; if (!B) return;
  var MAXLINES = 30;

  // A positive number (or 0 when o.zero is set). Returns { ok, n } or { ok: false, msg }.
  B.vnum = function (raw, o) {
    o = o || {};
    var s = String(raw == null ? '' : raw).trim();
    if (!/^\d+(\.\d{1,2})?$/.test(s)) return { ok: false, msg: B.tx('v2_num_err') };
    var n = parseFloat(s);
    if (n <= 0 && !o.zero) return { ok: false, msg: B.tx('v2_num_err') };
    if (o.max != null && n > o.max) return { ok: false, msg: B.tx('v2_too_big', { max: B.qn(o.max) }) };
    return { ok: true, n: n };
  };

  // Text with a length limit. Returns { ok, v } or { ok: false, msg }.
  B.vtext = function (raw, max, emptyKey) {
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return { ok: false, msg: B.tx(emptyKey || 'v2_name_req') };
    if (s.length > max) return { ok: false, msg: B.tx('v2_too_long', { max: String(max) }) };
    return { ok: true, v: s };
  };

  // Show an error under a form, without closing it.
  function formErr(f, msg) {
    var p = f.querySelector('.v2-form-err');
    if (!p) { p = document.createElement('p'); p.className = 'v2-err v2-form-err'; p.setAttribute('role', 'alert'); f.insertBefore(p, f.querySelector('button[type=submit],button:last-of-type') || null); }
    p.textContent = msg;
  }
  B.formErr = formErr;

  // Discount box on the sell screen.
  function cartSub() { return (B.S.cart || []).reduce(function (s, l) { return s + (+l.price || 0) * (+l.qty || 0); }, 0); }
  function discMsg(v) {
    if (v === '' || v == null) return '';
    var n = parseFloat(v);
    if (isNaN(n) || n < 0) return B.tx('v2_num_err');
    if (n > cartSub()) return B.tx('v2_disc_big', { max: B.inr(cartSub()) });
    return '';
  }
  document.addEventListener('input', function (e) {
    var d = e.target; if (!d || d.id !== 'disc') return;
    var msg = discMsg(d.value);
    var err = document.getElementById('v2-disc-err');
    if (!err) {
      err = document.createElement('p'); err.id = 'v2-disc-err'; err.className = 'v2-err'; err.setAttribute('role', 'alert');
      var row = d.closest('.row'); if (row) row.insertAdjacentElement('afterend', err);
    }
    err.textContent = msg;
  });
  // Stop paying when the discount is wrong. Runs before the app's own click handler.
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-act="pay"]'); if (!b) return;
    var d = document.getElementById('disc'); if (!d) return;
    var msg = discMsg(d.value);
    if (msg) { e.stopImmediatePropagation(); e.preventDefault(); B.toast(msg); }
  }, true);

  // Add to bill: at most 30 lines, and no more than the stock we have (owner override is on the confirm sheet).
  var origTile = B.ACT.tile;
  B.ACT.tile = function (el) {
    var id = el.dataset.id;
    var inCart = (B.S.cart || []).filter(function (l) { return l.product_id == id; })[0];
    if (!inCart && (B.S.cart || []).length >= MAXLINES) return B.toast(B.tx('v2_too_many'));
    var p = (B.S.products || []).filter(function (x) { return x.id == id; })[0];
    if (p && p.stock != null) {
      var have = inCart ? inCart.qty : 0;
      if (have + 1 > p.stock) return B.toast(B.tx('v2_short', { name: p.name, stock: B.qn(p.stock) }));
    }
    return origTile(el);
  };

  // Custom item form: a text price shows an error instead of becoming 0.
  B.FORM.custom = function (f, d) {
    var nm = B.vtext(d.name, 60, 'v2_name_req'); if (!nm.ok) return formErr(f, nm.msg);
    var pr = B.vnum(d.price, { zero: true }); if (!pr.ok) return formErr(f, pr.msg);
    var q = B.vnum(d.qty || '1'); if (!q.ok) return formErr(f, q.msg);
    if ((B.S.cart || []).length >= MAXLINES) return formErr(f, B.tx('v2_too_many'));
    B.S.cart.push({ product_id: null, name: nm.v, price: pr.n, qty: q.n });
    f.closest('.ov').close();
    B.render();
  };
})();

</script><script>
/* BizGrow v2: reads a spoken or typed bill line such as "Ramesh ko 2 kg atta, 50 rupees udhar".
   This is a simple word matcher for the demo. It knows English words, Hinglish words and digits.
   It does not parse Hindi, Marathi or Gujarati words yet, except the payment words. It never saves anything. */
(function () {
  'use strict';
  var B = window.BGV2; if (!B) return;

  var NUM = { ek: 1, one: 1, do: 2, two: 2, teen: 3, three: 3, char: 4, four: 4, paanch: 5, five: 5, chhe: 6, six: 6, saat: 7, seven: 7, aath: 8, eight: 8, nau: 9, nine: 9, das: 10, ten: 10 };
  var SYN = { chini: 'sugar', cheeni: 'sugar', chai: 'tea', doodh: 'milk', biscut: 'biscuits', biscuit: 'biscuits', tel: 'oil', sabun: 'soap', aata: 'atta' };
  var UNITS = ['kg', 'g', 'gm', 'gram', 'grams', 'ml', 'l', 'litre', 'liter', 'pack', 'packet', 'pc', 'pcs', 'bottle', 'nos', 'no'];
  var RUPEE = ['rupees', 'rupee', 'rupaye', 'rupay', 'rs', 'rs.', 'rupaya', 'रुपये', 'रुपए', 'रु', 'रुपया'];
  var METHOD = { udhar: 'udhar', credit: 'udhar', 'उधार': 'udhar', 'ઉધાર': 'udhar', upi: 'upi', online: 'upi', 'यूपीआई': 'upi', cash: 'cash', naqad: 'cash', nakad: 'cash', rokad: 'cash', 'रोख': 'cash', 'नकद': 'cash', 'રોકડ': 'cash' };
  var FILLER = ['ko', 'ka', 'ki', 'ke', 'aur', 'and', 'se', 'me', 'mein', 'ne', 'for', 'to', 'the', 'a', 'of', 'bill', 'likho', 'likh', 'do'];

  function norm(s) {
    return String(s || '').toLowerCase()
      .replace(/[०-९]/g, function (c) { return String('०१२३४५६७८९'.indexOf(c)); })
      .replace(/[૦-૯]/g, function (c) { return String('૦૧૨૩૪૫૬૭૮૯'.indexOf(c)); })
      .replace(/[,।!?]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function numOf(tok) {
    if (tok == null) return NaN;
    var t = tok.replace(/^₹/, '');
    if (/^\d+(\.\d+)?$/.test(t)) return parseFloat(t);
    return NUM.hasOwnProperty(t) ? NUM[t] : NaN;
  }
  function isRupee(tok) { return !!tok && (tok.charAt(0) === '₹' || RUPEE.indexOf(tok) >= 0); }
  function isUnit(tok) { return UNITS.indexOf(tok) >= 0; }

  // Find customers named in the text. Full name first, then a first name of 3+ letters.
  function partyMatches(text, toks) {
    var out = [];
    (B.S.customers || []).forEach(function (c) {
      if (c.deleted_at) return;
      var nm = String(c.name || '').toLowerCase();
      if (!nm) return;
      var first = nm.split(' ')[0];
      if (text.indexOf(nm) >= 0 || (first.length >= 3 && toks.indexOf(first) >= 0)) out.push(c);
    });
    return out;
  }

  // Returns { heard, lines, party, method, amount, unknown }.
  // party.status is 'one' (use this customer), 'choose' (ask the member), or 'none' (cash customer).
  B.parse = function (raw) {
    var text = norm(raw);
    var toks = text ? text.split(' ') : [];
    var used = {};
    var out = { heard: String(raw || '').trim(), lines: [], party: { status: 'none' }, method: null, amount: null, unknown: [] };

    // Payment word
    toks.forEach(function (t, i) { if (METHOD.hasOwnProperty(t) && !out.method) { out.method = METHOD[t]; used[i] = true; } });

    // Amount said in rupees (for a check only; it does not set the price)
    toks.forEach(function (t, i) {
      if (out.amount != null) return;
      var v = numOf(t);
      if (!isNaN(v) && (isRupee(toks[i + 1]) || isRupee(toks[i - 1]) || t.charAt(0) === '₹')) { out.amount = v; used[i] = true; }
    });

    // Products: the first word of the product name, plus a few local words.
    var prods = (B.S.products || []).filter(function (p) { return !p.deleted_at; });
    var seen = {};
    toks.forEach(function (t, i) {
      if (used[i]) return;
      var key = SYN[t] || t;
      var p = prods.filter(function (x) { return String(x.name).toLowerCase().split(' ')[0] === key; })[0];
      if (!p) return;
      var qty = null, j, k;
      // Quantity before the name, skipping a unit word ("2 kg atta")
      j = i - 1; if (j >= 0 && isUnit(toks[j]) && !used[j]) j--;
      if (j >= 0 && !used[j] && !isNaN(numOf(toks[j])) && !isRupee(toks[j + 1])) { qty = numOf(toks[j]); used[j] = true; }
      // Else quantity after the name ("atta 2 kg")
      if (qty == null) {
        k = i + 1; if (k < toks.length && isUnit(toks[k])) k++;
        if (k < toks.length && !used[k] && !isNaN(numOf(toks[k])) && !isRupee(toks[k + 1])) { qty = numOf(toks[k]); used[k] = true; }
      }
      used[i] = true;
      if (qty == null || !(qty > 0)) qty = 1;
      if (seen[p.id]) { seen[p.id].qty += qty; return; }
      seen[p.id] = { product_id: p.id, name: p.name, price: p.price, cost: p.cost, qty: qty, stock: p.stock };
      out.lines.push(seen[p.id]);
    });

    // Who is it for?
    var matches = partyMatches(text, toks);
    if (matches.length === 1) out.party = { status: 'one', customer: matches[0] };
    else if (matches.length > 1) out.party = { status: 'choose', options: matches };
    else if (out.method === 'udhar') out.party = { status: 'choose', options: (B.S.customers || []).filter(function (c) { return !c.deleted_at; }) };

    // Words we did not use
    toks.forEach(function (t, i) {
      if (used[i] || FILLER.indexOf(t) >= 0 || isUnit(t) || !isNaN(numOf(t)) || isRupee(t)) return;
      var isName = (B.S.customers || []).some(function (c) { return String(c.name).toLowerCase().indexOf(t) >= 0 && t.length >= 3; });
      if (!isName && out.unknown.indexOf(t) < 0) out.unknown.push(t);
    });
    return out;
  };
})();

</script><script>
/* BizGrow v2: the voice bill. Mic card on Home, a confirm sheet, and the assistant rename.
   A bill is never saved straight from speech. The member always taps Save on the confirm sheet. */
(function () {
  'use strict';
  var B = window.BGV2; if (!B) return;
  var LOC = { en: 'en-IN', hi: 'hi-IN', mr: 'mr-IN', gu: 'gu-IN' };
  var MAXLINES = 30;
  var MIC = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';

  function esc(s) { return B.esc(s); }
  function speechClass() { return window.SpeechRecognition || window.webkitSpeechRecognition || null; }
  function $(id) { return document.getElementById(id); }

  // Home card, shown to anyone who can make a bill.
  B.on('home', function (v) {
    if (v.querySelector('.v2-voice') || !B.can('sale')) return;
    var rename = B.can('settings') ? '<button class="linkbtn" data-v2="rename">' + esc(B.tx('v2_chotu_title')) + '</button>' : '';
    B.placeTop(v,
      '<section class="card v2-voice">' +
      '<h2>' + esc(B.tx('v2_voice_title', { name: B.assistant() })) + '</h2>' +
      '<p class="muted small">' + esc(B.tx('v2_voice_hint')) + '</p>' +
      '<button class="v2-mic" data-v2="mic">' + MIC + '<span>' + esc(B.tx('v2_mic')) + '</span></button>' +
      '<div class="v2-type"><input class="in" id="v2-type" maxlength="200" placeholder="' + esc(B.tx('v2_type_here')) + '">' +
      '<button class="btn" data-v2="check">' + esc(B.tx('v2_check')) + '</button></div>' +
      '<p class="v2-msg" id="v2-voice-msg" role="status"></p>' +
      '<p class="muted small">' + esc(B.tx('v2_try')) + ': <i>"Ramesh ko 2 kg atta, 50 rupees udhar"</i></p>' +
      rename + '</section>');
  });

  function msg(t) { var m = $('v2-voice-msg'); if (m) m.textContent = t || ''; }

  function listen() {
    var R = speechClass();
    if (!R) { msg(B.tx('v2_no_speech')); var ti = $('v2-type'); if (ti) ti.focus(); return; }
    var r;
    try { r = new R(); } catch (e) { msg(B.tx('v2_no_speech')); return; }
    r.lang = LOC[B.S.lang] || 'en-IN'; r.interimResults = false; r.maxAlternatives = 1;
    msg(B.tx('v2_listening'));
    r.onresult = function (ev) {
      var s = (ev.results && ev.results[0] && ev.results[0][0] && ev.results[0][0].transcript) || '';
      var ti = $('v2-type'); if (ti) ti.value = s;

  // Turn the words into a bill to check. Nothing is saved here.
  async function review(txt) {
    txt = String(txt || '').trim();
    if (!B.can('sale')) { msg(B.tx('v2_view_only')); return; }
    if (!txt) { msg(B.tx('v2_nothing')); return; }
    if (!B.S.products || !B.S.products.length || !B.S.customers || !B.S.customers.length) { try { await B.refresh(); } catch (e) { /* use what we have */ } }
    var p = B.parse(txt);
    if (!p.lines.length) { msg(B.tx('v2_nothing')); return; }

  }

  // ---- confirm sheet ----
  function openConfirm(p) {

      heard: p.heard, amount: p.amount, date: B.today(), more: false, override: false,
      method: p.method || 'cash', party: p.party.status === 'one' ? p.party.customer : null,
      choosing: p.party.status === 'choose', options: p.party.options || [],
      lines: p.lines.map(function (l) { return { product_id: l.product_id, name: l.name, stock: l.stock, qty: String(l.qty), price: String(l.price) }; })
    };
    if (st.method === 'udhar' && !st.party) st.choosing = true;
    var o = B.modal('<div class="v2-cf"></div>');
    var sheet = o.querySelector('.v2-cf');
    function paint() { sheet.innerHTML = html(st); refresh(); }
    o.addEventListener('click', function (e) {
      var el = e.target.closest('[data-vc]'); if (!el) return;
      var k = el.getAttribute('data-vc');
      if (k === 'cancel') { o.close(); return; }
      if (k === 'party') { var id = +el.getAttribute('data-id'); st.party = id ? st.options.filter(function (c) { return c.id === id; })[0] : null; st.choosing = false; paint(); return; }
      if (k === 'change') { st.choosing = true; paint(); return; }
      if (k === 'method') { st.method = el.getAttribute('data-m'); if (st.method === 'udhar' && !st.party) st.choosing = true; if (st.method !== 'udhar' && st.choosing && !st.party) st.choosing = false; paint(); return; }
      if (k === 'more') { st.more = !st.more; paint(); return; }
      if (k === 'rm') { st.lines.splice(+el.getAttribute('data-i'), 1); paint(); return; }
      if (k === 'save') { save(o, st); return; }
    });
    o.addEventListener('input', function (e) {
      var el = e.target; var k = el.getAttribute && el.getAttribute('data-vc');
      if (k === 'qty' || k === 'price') { st.lines[+el.getAttribute('data-i')][k] = el.value; refresh(); }
      if (k === 'date') { st.date = el.value; refresh(); }

    });
    function totalOf() {
      return st.lines.reduce(function (s, l) { var q = B.vnum(l.qty), pr = B.vnum(l.price, { zero: true }); return s + (q.ok && pr.ok ? q.n * pr.n : 0); }, 0);
    }

      for (var i = 0; i < st.lines.length; i++) {
        var l = st.lines[i];
        if (!B.vnum(l.qty).ok) return l.name + ': ' + B.tx('v2_num_err');
        if (!B.vnum(l.price, { zero: true }).ok) return l.name + ': ' + B.tx('v2_num_err');

      if (short.length && !(st.override && B.can('stock_override'))) return B.tx('v2_short', { name: short[0].name, stock: B.qn(short[0].stock) });
      if (st.date > B.today()) return B.tx('v2_date_future');

        (st.amount != null && Math.round(st.amount) !== Math.round(tot) ? '<p class="muted small">' + esc(B.tx('v2_said_amount', { amount: B.inr(st.amount) })) + '</p>' : '') +
        (pr ? '<p class="v2-err" role="alert">' + esc(pr) + '</p>' : '') +

  }

  function shortLines(st) {
    return st.lines.filter(function (l) { var q = B.vnum(l.qty); return q.ok && l.product_id && l.stock != null && q.n > l.stock; });
  }

  function html(st) {
    var h = '<h2>' + esc(B.tx('v2_check_title')) + '</h2>';
    h += '<p class="muted small">' + esc(B.tx('v2_heard')) + ': <i>"' + esc(st.heard) + '"</i></p>';
    // Party
    if (st.choosing) {
      h += '<p class="bold">' + esc(B.tx('v2_which_party')) + '</p><div class="v2-party">';
      st.options.slice(0, 8).forEach(function (c) { h += '<button class="btn sec" data-vc="party" data-id="' + c.id + '">' + esc(c.name) + '</button>'; });
      if (st.method !== 'udhar') h += '<button class="btn sec" data-vc="party" data-id="0">' + esc(B.tx('v2_cash_customer')) + '</button>';

      h += '<div class="v2-for"><div><span class="muted small">' + esc(B.tx('v2_for')) + '</span><div class="bold">' +
        esc(st.party ? st.party.name : B.tx('v2_cash_customer')) + '</div></div><button class="linkbtn" data-vc="change">' + esc(B.tx('v2_change')) + '</button></div>';
    }
    // Lines
    h += '<div class="v2-lines">';
    st.lines.forEach(function (l, i) {
      var short = l.product_id && l.stock != null && (B.vnum(l.qty).ok ? B.vnum(l.qty).n : 0) > l.stock;
      h += '<div class="v2-line"><div class="grow"><b>' + esc(l.name) + '</b>' +
        (short ? '<small class="v2-err">' + esc(B.tx('v2_stock_left', { stock: B.qn(l.stock) })) + '</small>' : '') + '</div>' +
        '<label class="v2-f">' + esc(B.tx('v2_qty')) + '<input class="in" inputmode="decimal" data-vc="qty" data-i="' + i + '" value="' + esc(l.qty) + '"></label>' +
        '<label class="v2-f">' + esc(B.tx('v2_price')) + '<input class="in" inputmode="decimal" data-vc="price" data-i="' + i + '" value="' + esc(l.price) + '"></label>' +
        '<button class="iconbtn" data-vc="rm" data-i="' + i + '" aria-label="' + esc(B.tx('v2_remove')) + '">&times;</button></div>';
    });
    h += '</div>';
    h += '<div class="v2-cf-sum"></div>';
    // How paid
    h += '<div class="v2-how">';
    [['cash', 'v2_cash'], ['upi', 'v2_upi'], ['udhar', 'v2_udhar']].forEach(function (m) {
      h += '<button class="btn ' + (st.method === m[0] ? '' : 'sec') + '" data-vc="method" data-m="' + m[0] + '">' + esc(B.tx(m[1])) + '</button>';
    });
    h += '</div>';
    // More options: back-date and owner stock override are hidden here
    h += '<button class="linkbtn" data-vc="more">' + esc(B.tx('v2_more')) + (st.more ? ' ▲' : ' ▼') + '</button>';
    if (st.more) {
      h += '<div class="v2-more">';
      if (B.can('backdate')) h += '<label class="f">' + esc(B.tx('v2_bill_date')) + '<input class="in" type="date" data-vc="date" max="' + B.today() + '" value="' + esc(st.date) + '"></label>';
      if (B.can('stock_override') && shortLines(st).length) h += '<label class="v2-check"><input type="checkbox" data-vc="override"' + (st.override ? ' checked' : '') + '> ' + esc(B.tx('v2_allow_neg')) + '</label>';
      h += '</div>';
    }
    h += '<button class="btn big block" data-vc="save">' + esc(B.tx('v2_save_bill')) + '</button>';
    h += '<button class="btn sec block" data-vc="cancel">' + esc(B.tx('v2_cancel')) + '</button>';
    return h;
  }

  async function save(o, st) {
    var body = {
      items: st.lines.map(function (l) { return { product_id: l.product_id, name: l.name, price: B.vnum(l.price, { zero: true }).n, qty: B.vnum(l.qty).n }; }),
      method: st.method
    };
    if (st.method === 'udhar' && st.party) body.customer_id = st.party.id;
    if (st.date && st.date !== B.today()) body.date = st.date;
    if (st.override && B.can('stock_override')) body.stock_override = true;
    try {
      await B.api('/sales', 'POST', body);
      o.close(); B.toast(B.tx('v2_saved'));
      await B.refresh(); B.render();
    } catch (e) {
      var err = o.querySelector('#v2-cf-err'); if (err) err.textContent = e.message || B.tx('v2_forbidden');
    }
  }

  // Rename the helper (owner only). Default name stays Chotu.
  function rename() {
    var o = B.modal('<h2>' + esc(B.tx('v2_chotu_title')) + '</h2><p class="muted small mb">' + esc(B.tx('v2_chotu_sub')) +
      '</p><div class="f"><label>' + esc(B.tx('v2_name')) + '</label><input class="in" id="v2-rn" maxlength="20" value="' + esc(B.assistant()) + '"></div>' +
      '<p class="v2-err" id="v2-rn-msg"></p><button class="btn big block" data-v2="rename-save">' + esc(B.tx('v2_chotu_save')) + '</button>');
    return o;
  }
  document.addEventListener('click', async function (e) {
    var el = e.target.closest && e.target.closest('[data-v2]'); if (!el) return;
    var k = el.getAttribute('data-v2');
    if (k === 'mic') return listen();
    if (k === 'check') return review(($('v2-type') || {}).value);
    if (k === 'rename') return rename();
    if (k === 'rename-save') {
      var name = (($('v2-rn') || {}).value || '').trim();
      var r = B.vtext(name, 20, 'v2_name_req');
      if (!r.ok) { $('v2-rn-msg').textContent = r.msg; return; }
      try {
        await B.api('/v2/settings', 'PUT', { assistant_name: name });
        B.S.me.shop.assistant_name = name;
        el.closest('.ov').close(); B.toast(B.tx('v2_saved')); B.render();
      } catch (err) { $('v2-rn-msg').textContent = err.message || B.tx('v2_forbidden'); }
    }
  });
})();

</script><script>
/* BizGrow v2: udhar (credit) view. Due dates, days late, party ledger, advance, and reminder drafts.
   Shown on the Khata page (list) and on each customer page (ledger). Reminders open WhatsApp with a draft the member can edit. */
(function () {
  'use strict';
  var B = window.BGV2; if (!B) return;
  var LANGS = [['en', 'English'], ['hi', 'हिन्दी'], ['mr', 'मराठी'], ['gu', 'ગુજરાતી']];
  var people = {};

  function esc(s) { return B.esc(s); }
  // Text in a chosen language (not always the app language).
  function tl(L, k, vars) {
    var d = (window.I18N && window.I18N[L]) || {};
    var s = d[k] || (window.I18N && window.I18N.en && window.I18N.en[k]) || k;
    if (vars) Object.keys(vars).forEach(function (n) { s = s.split('{' + n + '}').join(vars[n]); });
    return s;
  }
  function lateText(n) { return n > 0 ? B.tx('v2_days_late', { n: String(n) }) : B.tx('v2_on_time'); }
  function fmtDate(s) { return s ? String(s).split('-').reverse().join('/') : '-'; }

  function loadUdhar() { return B.api('/v2/udhar'); }

  // Khata list: totals and every person who owes money, with their due date and days late.
  B.on('khata', async function (v, args) {
    if (args && args[0]) return;
    var d; try { d = await loadUdhar(); } catch (e) { return; }
    people = {};
    d.people.forEach(function (p) { people[p.customer_id] = p; });
    var money = d.total != null;
    var h = '<section class="card v2-udhar"><h3>' + esc(B.tx('v2_udhar_title')) + '</h3>' +
      '<p class="muted small">' + esc(B.tx('v2_udhar_sub')) + '</p>';
    if (money) h += '<div class="v2-totals"><div><span class="muted small">' + esc(B.tx('v2_total_due')) + '</span><b>' + esc(B.inr(d.total)) + '</b></div>' +
      '<div><span class="muted small">' + esc(B.tx('v2_overdue_total')) + '</span><b class="v2-err">' + esc(B.inr(d.overdue_total)) + '</b></div></div>';
    if (!d.people.length) h += '<p class="muted">' + esc(B.tx('v2_no_udhar')) + '</p>';
    d.people.forEach(function (p) {
      h += '<div class="v2-row"><div class="grow"><b>' + esc(p.name) + '</b><small class="' + (p.overdue ? 'v2-err' : 'muted') + '">' +
        esc(B.tx('v2_due')) + ': ' + esc(fmtDate(p.oldest_due)) + ' · ' + esc(lateText(p.days_late)) +
        (p.advance > 0 ? ' · ' + esc(B.tx('v2_advance')) + ' ' + esc(B.inr(p.advance)) : '') + '</small></div>' +
        '<div class="v2-amt"><b>' + esc(B.inr(p.balance)) + '</b></div>' +
        '<button class="btn sec sm" data-v2="rem" data-id="' + p.customer_id + '">' + esc(B.tx('v2_reminder')) + '</button></div>';
    });
    h += '</section>';
    B.placeTop(v, h);
  });

  // Customer page: a ledger of their open bills, advance, and a reminder button.
  B.on('khata', async function (v, args) {
    if (!args || !args[0]) return;
    var id = +args[0];
    var d; try { d = await loadUdhar(); } catch (e) { return; }
    var p = d.people.filter(function (x) { return x.customer_id === id; })[0];
    people[id] = p || people[id];
    var h = '<section class="card v2-udhar"><h3>' + esc(B.tx('v2_ledger_title')) + '</h3>';
    if (!p) h += '<p class="muted">' + esc(B.tx('v2_no_udhar')) + '</p>';
    else {
      h += '<div class="v2-totals"><div><span class="muted small">' + esc(B.tx('v2_balance')) + '</span><b>' + esc(B.inr(p.balance)) + '</b></div>' +
        '<div><span class="muted small">' + esc(B.tx('v2_advance')) + '</span><b>' + esc(B.inr(p.advance)) + '</b></div></div>';
      h += '<div class="v2-ledger">';
      p.bills.forEach(function (b) {
        h += '<div class="v2-row"><div class="grow"><b>' + esc(b.bill_no) + '</b><small class="muted">' + esc(fmtDate(b.date)) +
          ' · ' + esc(B.tx('v2_due')) + ' ' + esc(fmtDate(b.due_date)) + ' · ' + esc(lateText(b.days_late)) + '</small>' +
          '<small class="muted">' + esc(B.tx('v2_paid_so_far')) + ' ' + esc(B.inr(b.paid)) + ' / ' + esc(B.inr(b.total)) + '</small></div>' +
          '<div class="v2-amt"><b>' + esc(B.inr(b.due)) + '</b></div></div>';
      });
      h += '</div><button class="btn block" data-v2="rem" data-id="' + id + '">' + esc(B.tx('v2_reminder')) + '</button>';
    }
    h += '</section>';
    B.placeTop(v, h);
  });

  // Reminder draft: pick language and tone, edit, then open WhatsApp.
  function draft(L, tone, p) {
    var late = p.days_late > 0 ? tl(L, 'v2_late_suffix', { n: String(p.days_late) }) : '';
    return tl(L, tone === 'firm' ? 'v2_rem_firm' : 'v2_rem_polite', {
      name: p.name, shop: B.S.me.shop.name, amount: B.inr(p.balance), late: late
    });
  }
  function waHref(p, text) {
    var digits = String(p.phone || '').replace(/\D/g, '').slice(-10);
    return digits.length === 10 ? 'https://wa.me/91' + digits + '?text=' + encodeURIComponent(text) : '';
  }
  function openRem(p) {
    var o = B.modal('<h2>' + esc(B.tx('v2_reminder')) + '</h2>' +
      '<p class="bold">' + esc(p.name) + ' · ' + esc(B.inr(p.balance)) + '</p>' +
      '<div class="f"><label>' + esc(B.tx('v2_lang')) + '</label><select class="in" data-rv="lang">' +
      LANGS.map(function (l) { return '<option value="' + l[0] + '"' + (l[0] === B.S.lang ? ' selected' : '') + '>' + l[1] + '</option>'; }).join('') + '</select></div>' +
      '<div class="f"><label>' + esc(B.tx('v2_tone')) + '</label><select class="in" data-rv="tone">' +
      '<option value="polite">' + esc(B.tx('v2_polite')) + '</option><option value="firm">' + esc(B.tx('v2_firm_opt')) + '</option></select></div>' +
      '<div class="f"><label>' + esc(B.tx('v2_draft')) + '</label><textarea class="in" rows="6" data-rv="text"></textarea></div>' +
      '<p class="muted small">' + esc(B.tx('v2_draft_note')) + '</p>' +
      '<p class="v2-err" id="v2-rem-msg"></p>' +
      '<a class="btn big block" id="v2-rem-go" target="_blank" rel="noopener">' + esc(B.tx('v2_open_wa')) + '</a>');
    var ta = o.querySelector('[data-rv="text"]');
    var go = o.querySelector('#v2-rem-go');
    function sync() {
      var text = ta.value; var href = waHref(p, text);
      if (href) { go.href = href; go.removeAttribute('aria-disabled'); o.querySelector('#v2-rem-msg').textContent = ''; }
      else { go.removeAttribute('href'); go.setAttribute('aria-disabled', 'true'); o.querySelector('#v2-rem-msg').textContent = B.tx('v2_no_phone'); }
    }
    function redraft() {
      var L = o.querySelector('[data-rv="lang"]').value, tone = o.querySelector('[data-rv="tone"]').value;
      ta.value = draft(L, tone, p); sync();
    }
    o.addEventListener('change', function (e) { if (e.target.getAttribute && e.target.getAttribute('data-rv')) redraft(); });
    ta.addEventListener('input', sync);
    redraft();
  }

  document.addEventListener('click', async function (e) {
    var el = e.target.closest && e.target.closest('[data-v2="rem"]'); if (!el) return;
    var id = +el.getAttribute('data-id');
    var p = people[id];
    if (!p) { try { var d = await loadUdhar(); p = d.people.filter(function (x) { return x.customer_id === id; })[0]; } catch (err) { } }
    if (!p) return B.toast(B.tx('v2_no_udhar'));
    openRem(p);
  });
})();

</script><script>
/* BizGrow v2: staff page. Replaces the Team page content (owner only). Invite, change role, suspend or activate, remove, and a demo switch of user. */
(function () {
  'use strict';
  var B = window.BGV2; if (!B) return;
  var ROLES = ['manager', 'cashier', 'stock-keeper', 'accountant'];
  var RL = { owner: 'v2_role_owner', manager: 'v2_role_manager', cashier: 'v2_role_cashier', 'stock-keeper': 'v2_role_stock', accountant: 'v2_role_accountant' };
  var DL = { owner: 'v2_desc_owner', manager: 'v2_desc_manager', cashier: 'v2_desc_cashier', 'stock-keeper': 'v2_desc_stock', accountant: 'v2_desc_accountant' };
  function esc(s) { return B.esc(s); }
  function $(id) { return document.getElementById(id); }

  function rowHtml(u) {
    var isOwner = u.role === 'owner';
    var h = '<div class="v2-row"><div class="grow"><b>' + esc(u.name) + '</b>' + (u.you ? ' <span class="muted small">(' + esc(B.tx('v2_you')) + ')</span>' : '') +
      '<small class="muted">' + esc(B.tx(DL[u.role] || 'v2_desc_owner')) + '</small>' +
      '<small class="' + (u.status === 'suspended' ? 'v2-err' : 'muted') + '">' + esc(B.tx(u.status === 'suspended' ? 'v2_suspended' : 'v2_active')) + '</small></div>';
    h += '<div class="v2-staffctl">';
    if (isOwner) h += '<span class="bold small">' + esc(B.tx(RL.owner)) + '</span>';
    else {
      h += '<select class="in" data-sv="role" data-id="' + u.id + '" aria-label="' + esc(B.tx('v2_role')) + '">' +
        ROLES.map(function (r) { return '<option value="' + r + '"' + (r === u.role ? ' selected' : '') + '>' + esc(B.tx(RL[r])) + '</option>'; }).join('') + '</select>';
      h += '<div class="row"><button class="btn sec sm" data-v2="status" data-id="' + u.id + '" data-s="' + (u.status === 'suspended' ? 'active' : 'suspended') + '">' +
        esc(B.tx(u.status === 'suspended' ? 'v2_activate' : 'v2_suspend')) + '</button>' +
        '<button class="btn sec sm" data-v2="remove" data-id="' + u.id + '">' + esc(B.tx('v2_remove')) + '</button></div>';
    }
    return h + '</div></div>';
  }

  B.on('team', async function (v) {
    var list;
    try { list = await B.api('/v2/staff'); } catch (e) { return; }
    var h = B.head(B.tx('v2_staff_title'), B.tx('v2_staff_sub'), '<button class="btn" data-v2="add">' + esc(B.tx('v2_add_staff')) + '</button>');
    h += '<section class="card"><div class="list">' + list.map(rowHtml).join('') + '</div></section>';
    h += '<section class="card mt"><h3>' + esc(B.tx('v2_switch_title')) + '</h3><p class="muted small">' + esc(B.tx('v2_demo_note')) + '</p><div class="v2-party">' +
      list.filter(function (u) { return u.status !== 'suspended'; }).map(function (u) {
        return '<button class="btn sec sm" data-v2="switch" data-id="' + u.id + '">' + esc(u.name) + ' · ' + esc(B.tx(RL[u.role] || 'v2_role_owner')) + '</button>';
      }).join('') + '</div></section>';
    v.innerHTML = h;
  });

  function refreshPage() { B.render(); }

  // Change a role from the select box.
  document.addEventListener('change', async function (e) {
    var el = e.target; if (!el.getAttribute || el.getAttribute('data-sv') !== 'role') return;
    try { await B.api('/v2/staff/' + el.getAttribute('data-id'), 'PUT', { role: el.value }); B.toast(B.tx('v2_saved')); refreshPage(); }
    catch (err) { B.toast(err.message || B.tx('v2_forbidden')); refreshPage(); }
  });

  function addModal() {
    var o = B.modal('<h2>' + esc(B.tx('v2_add_staff').replace(/^\+\s*/, '')) + '</h2>' +
      '<div class="f"><label>' + esc(B.tx('v2_name')) + '</label><input class="in" id="v2-st-name" maxlength="60"></div>' +
      '<div class="f"><label>' + esc(B.tx('v2_email')) + '</label><input class="in" id="v2-st-email" type="email"></div>' +
      '<div class="f"><label>' + esc(B.tx('v2_role')) + '</label><select class="in" id="v2-st-role">' +
      ROLES.map(function (r) { return '<option value="' + r + '">' + esc(B.tx(RL[r])) + ' - ' + esc(B.tx(DL[r])) + '</option>'; }).join('') + '</select></div>' +
      '<p class="v2-err" id="v2-st-msg"></p><button class="btn big block" data-v2="add-save">' + esc(B.tx('v2_invite')) + '</button>');
    return o;
  }
  function confirmRemove(id, name) {
    var o = B.modal('<h2>' + esc(B.tx('v2_remove')) + '</h2><p class="mb">' + esc(name) + '</p><p class="muted small mb">' + esc(B.tx('v2_remove_q')) + '</p>' +
      '<button class="btn big block" data-v2="remove-yes" data-id="' + id + '" style="background:var(--danger)">' + esc(B.tx('v2_remove')) + '</button>' +
      '<button class="btn sec block" data-v2="cancel-ov">' + esc(B.tx('v2_cancel')) + '</button>');
    return o;
  }

  document.addEventListener('click', async function (e) {
    var el = e.target.closest && e.target.closest('[data-v2]'); if (!el) return;
    var k = el.getAttribute('data-v2'), id = el.getAttribute('data-id');
    try {
      if (k === 'add') return addModal();
      if (k === 'add-save') {
        var nm = B.vtext(($('v2-st-name') || {}).value, 60, 'v2_name_req');
        if (!nm.ok) return ($('v2-st-msg').textContent = nm.msg);
        var em = String(($('v2-st-email') || {}).value || '').trim();
        if (!/^\S+@\S+\.\S+$/.test(em)) return ($('v2-st-msg').textContent = B.tx('v2_email_bad'));
        await B.api('/v2/staff', 'POST', { name: nm.v, email: em, role: $('v2-st-role').value });
        el.closest('.ov').close(); B.toast(B.tx('v2_invited')); return refreshPage();
      }
      if (k === 'status') { await B.api('/v2/staff/' + id, 'PUT', { status: el.getAttribute('data-s') }); return refreshPage(); }
      if (k === 'remove') return confirmRemove(id, el.closest('.v2-row').querySelector('b').textContent);
      if (k === 'remove-yes') { await B.api('/v2/staff/' + id, 'DELETE'); el.closest('.ov').close(); B.toast(B.tx('v2_saved')); return refreshPage(); }
      if (k === 'cancel-ov') return el.closest('.ov').close();
      if (k === 'switch') {
        await B.api('/v2/switch', 'POST', { id: +id });
        B.S.me = await B.api('/me');
        location.hash = '#/home'; return B.render();
      }
    } catch (err) { B.toast(err.message || B.tx('v2_forbidden')); }
  });
})();

</script><script>
/* BizGrow v2: audit log page. Who changed what, and when. Owner and manager can undo a delete. */
(function () {
  'use strict';
  var B = window.BGV2; if (!B) return;
  var ACT = { create: 'v2_act_create', edit: 'v2_act_edit', delete: 'v2_act_delete', discount: 'v2_act_discount', 'back-date': 'v2_act_backdate', 'role change': 'v2_act_role', undo: 'v2_act_undo' };
  function esc(s) { return B.esc(s); }
  function when(at) {
    var d = new Date(at); if (isNaN(d)) return '';
    return d.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
  }

  function rowHtml(a) {
    var canUndo = B.can('audit.undo') && a.action === 'delete' && !a.undone;
    return '<div class="v2-row"><div class="grow"><b>' + esc(a.label) + '</b>' +
      '<small class="muted">' + esc(B.tx(ACT[a.action] || 'v2_act_edit')) + ' · ' + esc(a.by) + ' · ' + esc(when(a.at)) + '</small>' +
      (a.undone ? '<small class="muted">' + esc(B.tx('v2_undone')) + '</small>' : '') + '</div>' +
      (canUndo ? '<button class="btn sec sm" data-v2="undo" data-id="' + a.id + '">' + esc(B.tx('v2_undo')) + '</button>' : '') + '</div>';
  }

  async function load(v) {
    var list;
    try { list = await B.api('/v2/audit'); } catch (e) { B.toast(B.tx('v2_forbidden')); return; }
    var h = B.head(B.tx('v2_audit_title'), B.tx('v2_audit_sub'), '');
    h += '<section class="card"><div class="list">' +
      (list.length ? list.map(rowHtml).join('') : '<p class="muted">' + esc(B.tx('v2_nothing_yet')) + '</p>') +
      '</div></section>';
    v.innerHTML = h;
  }

  B.on('audit', async function (v) {
    if (!B.can('audit')) { v.innerHTML = B.head(B.tx('v2_audit_title'), '', '') + '<p class="muted">' + esc(B.tx('v2_forbidden')) + '</p>'; return; }
    await load(v);
  });

  document.addEventListener('click', async function (e) {
    var el = e.target.closest && e.target.closest('[data-v2="undo"]'); if (!el) return;
    el.disabled = true;
    try {
      await B.api('/v2/audit/' + el.getAttribute('data-id') + '/undo', 'POST');
      B.toast(B.tx('v2_undone'));
      var v = document.getElementById('view'); if (v && B.S.page === 'audit') await load(v);
    } catch (err) { B.toast(err.message || B.tx('v2_forbidden')); el.disabled = false; }
  });

  // Add the link to the More list (the sidebar link is added by the core file).
  B.on('more', function (v) {
    var list = v.querySelector('.list'); if (list) B.addMoreLinks(list);
  });
})();

</script><script>
/* BizGrow v2: owner's evening summary. What happened today, with a WhatsApp share button. Owner and manager only. */
(function () {
  'use strict';
  var B = window.BGV2; if (!B) return;
  function esc(s) { return B.esc(s); }

  function shareText(s) {
    var lines = [
      B.S.me.shop.name + ' - ' + B.tx('v2_sum_title') + ' (' + s.date.split('-').reverse().join('/') + ')',
      B.tx('v2_sum_bills') + ': ' + s.bills,
      B.tx('v2_sum_udhar') + ': ' + B.inr(s.udhar_added),
      B.tx('v2_sum_disc') + ': ' + B.inr(s.discounts_given),
      B.tx('v2_sum_rec') + ': ' + B.inr(s.payments_recovered),
      B.tx('v2_sum_edits') + ': ' + s.edits,
      B.tx('v2_sum_deletes') + ': ' + s.deletes
    ];
    if (s.delete_lines && s.delete_lines.length) lines.push(B.tx('v2_sum_recent') + ':', s.delete_lines.join('\n'));
    return lines.join('\n');
  }

  B.on('summary', async function (v) {
    if (!B.can('summary')) { v.innerHTML = B.head(B.tx('v2_sum_title'), '', '') + '<p class="muted">' + esc(B.tx('v2_forbidden')) + '</p>'; return; }
    var s;
    try { s = await B.api('/v2/summary?date=' + B.today()); } catch (e) { B.toast(B.tx('v2_forbidden')); return; }
    var money = B.can('view_money');
    function tile(label, val) {
      return '<div class="v2-tile"><span class="muted small">' + esc(label) + '</span><b>' + esc(val) + '</b></div>';
    }
    var h = B.head(B.tx('v2_sum_title'), B.tx('v2_sum_sub'), '');
    h += '<section class="card"><div class="v2-tiles">' +
      tile(B.tx('v2_sum_bills'), String(s.bills)) +
      (money ? tile(B.tx('v2_sum_udhar'), B.inr(s.udhar_added)) : '') +
      (money ? tile(B.tx('v2_sum_disc'), B.inr(s.discounts_given)) : '') +
      (money ? tile(B.tx('v2_sum_rec'), B.inr(s.payments_recovered)) : '') +
      tile(B.tx('v2_sum_edits'), String(s.edits)) +
      tile(B.tx('v2_sum_deletes'), String(s.deletes)) +
      '</div></section>';
    if (s.delete_lines && s.delete_lines.length) {
      h += '<section class="card mt"><h3>' + esc(B.tx('v2_sum_recent')) + '</h3><div class="list">' +
        s.delete_lines.map(function (l) { return '<div class="li"><span class="grow">' + esc(l) + '</span></div>'; }).join('') + '</div></section>';
    }
    h += '<section class="card mt"><a class="btn big block" target="_blank" rel="noopener" href="https://wa.me/?text=' +
      encodeURIComponent(shareText(s)) + '">' + esc(B.tx('v2_sum_share')) + '</a></section>';
    v.innerHTML = h;
  });

  // Add the link to the More list (owner and manager see it).
  B.on('more', function (v) {
    var list = v.querySelector('.list'); if (list && B.can('summary')) B.addMoreLinks(list);
  });
})();

</script><script>
/* BizGrow v2: privacy extras. Export all data as a file, and delete all data after typing DELETE.
   The original download link and erase form are replaced so they use the demo routes. */
(function () {
  'use strict';
  var B = window.BGV2; if (!B) return;
  function esc(s) { return B.esc(s); }

  // Replace the plain download link with a button that saves a JSON file.
  B.on('privacy', function (v) {
    var a = v.querySelector('a[href="/api/privacy/download"]');
    if (!a) return;
    var card = a.closest('.card');
    a.outerHTML = '<button class="btn" data-v2="export">' + esc(B.tx('v2_exp_btn')) + '</button>';
    var p = card && card.querySelector('p'); if (p) p.textContent = B.tx('v2_exp_sub');
    var h = card && card.querySelector('h3'); if (h) h.textContent = B.tx('v2_exp_title');
  });

  // Delete card: use the v2 wording in the current language.
  B.ACT.erase = function () {
    return B.modal('<h2 style="color:var(--danger)">' + esc(B.tx('v2_del_title')) + '</h2>' +
      '<p class="muted small mb">' + esc(B.tx('v2_del_sub')) + '</p>' +
      '<form data-form="erase"><div class="f"><label>' + esc(B.tx('v2_del_type')) + '</label>' +
      '<input class="in" name="confirm" autocomplete="off"></div>' +
      '<button class="btn red big block" type="submit">' + esc(B.tx('v2_del_btn')) + '</button></form>');
  };

  B.FORM.erase = async function (f, d) {
    if (String(d.confirm || '').trim() !== 'DELETE') return B.formErr(f, B.tx('v2_del_type'));
    try {
      await B.api('/v2/erase', 'POST', { confirm: 'DELETE' });
    } catch (err) { return B.formErr(f, err.message || B.tx('v2_forbidden')); }
    f.closest('.ov').close();
    B.toast(B.tx('v2_del_done'));
    B.S.me = null; location.hash = ''; B.render();
  };

  document.addEventListener('click', async function (e) {
    var el = e.target.closest && e.target.closest('[data-v2="export"]'); if (!el) return;
    try {
      var data = await B.api('/v2/export');
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'bizgrow-my-data.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    } catch (err) { B.toast(err.message || B.tx('v2_forbidden')); }
  });
})();

</script></body></html>
